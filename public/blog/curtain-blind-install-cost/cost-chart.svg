<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="800" height="600" fill="#FFFFFF"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#2B2622">커튼·블라인드 설치 비용 한눈에 (창별·방식별)</text>
  <text x="30" y="70" font-size="13" fill="#8A8078">실제 시공 데이터 기준 · 시공비 포함 · 단위: 만원</text>

  <!-- guide lines -->
  <g stroke="#EFEAE4" stroke-width="1">
    <line x1="250" y1="95" x2="250" y2="520"/>
    <line x1="380" y1="95" x2="380" y2="520"/>
    <line x1="510" y1="95" x2="510" y2="520"/>
    <line x1="640" y1="95" x2="640" y2="520"/>
    <line x1="770" y1="95" x2="770" y2="520"/>
  </g>
  <g font-size="12" fill="#B0A69C" text-anchor="middle">
    <text x="250" y="540">0</text>
    <text x="380" y="540">25</text>
    <text x="510" y="540">50</text>
    <text x="640" y="540">75</text>
    <text x="770" y="540">100만원</text>
  </g>

  <!-- rows: x = 250 + 만원*5.2 -->
  <!-- 1. 다이소 접착식 0.5 -->
  <g>
    <text x="238" y="122" font-size="14" fill="#4A423C" text-anchor="end">다이소 접착식 (창 1개)</text>
    <rect x="250" y="106" width="550" height="0" fill="none"/>
    <rect x="250" y="106" width="6" height="24" rx="3" fill="#C96F4A"/>
    <text x="266" y="123" font-size="13" font-weight="700" fill="#C96F4A">5,000원 (셀프)</text>
  </g>

  <!-- 2. 셀프 온라인 맞춤 (거실) 7~13 -->
  <g>
    <text x="238" y="182" font-size="14" fill="#4A423C" text-anchor="end">온라인 맞춤+셀프 (거실 창)</text>
    <rect x="286" y="166" width="32" height="24" rx="6" fill="#D98B63"/>
    <text x="328" y="183" font-size="13" font-weight="700" fill="#2B2622">7만~13만</text>
  </g>

  <!-- 3. 방 블라인드 (업체·개당) 9~15 -->
  <g>
    <text x="238" y="242" font-size="14" fill="#4A423C" text-anchor="end">방 블라인드 (업체 · 개당)</text>
    <rect x="297" y="226" width="31" height="24" rx="6" fill="#C96F4A"/>
    <text x="338" y="243" font-size="13" font-weight="700" fill="#2B2622">9만~15만</text>
  </g>

  <!-- 4. 안방 암막커튼 (업체) 15~25 -->
  <g>
    <text x="238" y="302" font-size="14" fill="#4A423C" text-anchor="end">안방 암막커튼 (업체)</text>
    <rect x="328" y="286" width="52" height="24" rx="6" fill="#C96F4A"/>
    <text x="390" y="303" font-size="13" font-weight="700" fill="#2B2622">15만~25만</text>
  </g>

  <!-- 5. 거실 암막 단독 (업체) 20~40 -->
  <g>
    <text x="238" y="362" font-size="14" fill="#4A423C" text-anchor="end">거실 암막 단독 (업체)</text>
    <rect x="354" y="346" width="104" height="24" rx="6" fill="#C96F4A"/>
    <text x="468" y="363" font-size="13" font-weight="700" fill="#2B2622">20만~40만</text>
  </g>

  <!-- 6. 거실 쉬폰+암막 이중 (업체) 40~60 -->
  <g>
    <text x="238" y="422" font-size="14" fill="#4A423C" text-anchor="end">거실 쉬폰+암막 이중 (업체)</text>
    <rect x="458" y="406" width="104" height="24" rx="6" fill="#B05A38"/>
    <text x="572" y="423" font-size="13" font-weight="700" fill="#2B2622">40만~60만</text>
  </g>

  <!-- 7. 30평대(74타입) 집 전체 80~100 -->
  <g>
    <text x="238" y="482" font-size="14" fill="#4A423C" text-anchor="end">30평대(74타입) 집 전체</text>
    <rect x="666" y="466" width="104" height="24" rx="6" fill="#8F4527"/>
    <text x="662" y="459" font-size="13" font-weight="700" fill="#2B2622" text-anchor="start">80만~100만</text>
  </g>

  <text x="30" y="580" font-size="12" fill="#8A8078">※ 원단 등급·주름 배수·창 크기에 따라 같은 구성도 20~50% 차이. 전동은 2~4배.</text>
</svg>
