<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="겨울 웃풍 잡기 단계별 비용 사다리 — 셀프 문풍지부터 샷시 교체까지">
  <rect width="720" height="390" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">겨울 웃풍, 단계별로 얼마나 들까</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">아래로 갈수록 비용↑ 효과 범위↑ · 실제 견적 빅데이터 기준 · 금액은 범위</text>

  <!-- step 1 -->
  <g>
    <rect x="24" y="88" width="240" height="60" rx="10" fill="#e8b399"/>
    <text x="40" y="112" font-size="14" font-weight="700" fill="#4a3527">1단계 · 셀프 문풍지+필름</text>
    <text x="40" y="134" font-size="12" fill="#6b5d52">거실 창 기준 1만~5만원</text>
    <text x="280" y="122" font-size="12" fill="#8a8175">창틀 틈·유리면 냉기부터 잡는다</text>
  </g>

  <!-- step 2 -->
  <g>
    <rect x="80" y="164" width="280" height="60" rx="10" fill="#d98b6a"/>
    <text x="96" y="188" font-size="14" font-weight="700" fill="#3d2317">2단계 · 업체 시공(거실만)</text>
    <text x="96" y="210" font-size="12" fill="#57392a">기존 필름 제거+재시공 포함 20만원대 후반</text>
    <text x="376" y="198" font-size="12" fill="#8a8175">셀프가 불안한 고층·대형 창</text>
  </g>

  <!-- step 3 -->
  <g>
    <rect x="136" y="240" width="320" height="60" rx="10" fill="#cf7a55"/>
    <text x="152" y="264" font-size="14" font-weight="700" fill="#33190e">3단계 · 업체 시공(집 전체)</text>
    <text x="152" y="286" font-size="12" fill="#4d2c1c">59타입 90만~120만 · 74~84타입 110만~150만</text>
    <text x="472" y="274" font-size="12" fill="#8a8175">모든 창 웃풍·결로 동시에 관리</text>
  </g>

  <!-- step 4 -->
  <g>
    <rect x="192" y="316" width="360" height="60" rx="10" fill="#a84e2c"/>
    <text x="208" y="340" font-size="14" font-weight="700" fill="#ffffff">4단계 · 로이유리 샷시 교체</text>
    <text x="208" y="362" font-size="12" fill="#f3ddd2">집 전체 600만~1,500만원 (84타입 전체 기준)</text>
    <text x="568" y="350" font-size="12" fill="#8a8175">틈으로 새는 집의 근본 해결책</text>
  </g>
</svg>
