    <text x="0" y="262" class="l">확장</text>
    <rect x="90" y="247" width="27" height="22" rx="4" fill="#e8b48f"/>
    <text x="127" y="263" class="v">175 (2%)</text>

    <text x="0" y="297" class="l">설비</text>
    <rect x="90" y="282" width="17" height="22" rx="4" fill="#e8b48f"/>
