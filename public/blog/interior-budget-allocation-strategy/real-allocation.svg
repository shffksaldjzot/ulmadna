    <text x="0" y="157" class="l">전기</text>
    <rect x="90" y="142" width="59" height="22" rx="4" fill="#d9885f"/>
    <text x="159" y="158" class="v">387 (5%)</text>

    <text x="0" y="192" class="l">철거</text>
    <rect x="90" y="177" width="49" height="22" rx="4" fill="#d9885f"/>
    <text x="149" y="193" class="v">324 (4%)</text>

    <text x="0" y="227" class="l">타일</text>
    <rect x="90" y="212" width="28" height="22" rx="4" fill="#e8b48f"/>
