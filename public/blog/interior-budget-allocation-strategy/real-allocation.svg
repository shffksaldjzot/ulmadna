<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="33평 실제 견적 약 7,900만원의 공정별 비중 — 가구 28%, 목공 11%, 도배 7%, 욕실 5%, 전기 5%, 철거 4%">
  <style>
    text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .t { font-size: 20px; font-weight: 700; fill: #2b2b2b; }
    .s { font-size: 13px; fill: #777; }
    .l { font-size: 15px; fill: #2b2b2b; }
    .v { font-size: 14px; font-weight: 700; fill: #2b2b2b; }
    .n { font-size: 12px; fill: #888; }
  </style>
  <rect width="720" height="470" fill="#fbf8f4"/>
