  <text x="30" y="62" class="s">항목 합계 약 7,900만원 기준 · 단위 만원</text>

  <g transform="translate(30,88)">
    <text x="0" y="17" class="l">가구 공사</text>
    <rect x="90" y="2" width="340" height="22" rx="4" fill="#c2603d"/>
