    <text x="0" y="87" class="l">도배</text>
    <rect x="90" y="72" width="82" height="22" rx="4" fill="#d9885f"/>
    <text x="182" y="88" class="v">541 (7%)</text>

    <text x="0" y="122" class="l">욕실 1칸</text>
    <rect x="90" y="107" width="61" height="22" rx="4" fill="#d9885f"/>
