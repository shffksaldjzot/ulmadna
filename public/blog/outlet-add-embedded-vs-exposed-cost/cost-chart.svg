<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" role="img" aria-label="콘센트 증설 비용 방식별 1개당 가격 범위 막대그래프 — 노출 몰딩, 가벽·천장 배선 매립, 콘크리트 까대기 매립, 인테리어 중 묶음 추가, 분전반 전용회로 신설">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#2b2b2b">콘센트 증설 비용 — 방식별 1개당 가격 범위</text>
  <text x="40" y="74" font-size="15" fill="#8a8a8a">아파트 기준 · 출장비 포함 · 현장 난이도에 따라 변동 · 단위: 만원</text>

  <!-- baseline -->
  <line x1="40" y1="420" x2="830" y2="420" stroke="#dddddd" stroke-width="2"/>

  <!-- 노출 몰딩 8~10 -->
  <rect x="75" y="360" width="90" height="12" rx="4" fill="#C26B4A"/>
  <text x="120" y="350" font-size="16" fill="#a8512f" text-anchor="middle">8~10</text>
  <text x="120" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">노출 몰딩</text>
  <text x="120" y="468" font-size="12" fill="#999" text-anchor="middle">거주 중 · 벽 안 뚫음</text>

  <!-- 가벽·천장 배선 매립 10~15 -->
  <rect x="230" y="330" width="90" height="30" rx="4" fill="#C26B4A"/>
  <text x="275" y="320" font-size="16" fill="#a8512f" text-anchor="middle">10~15</text>
  <text x="275" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">가벽·천장배선 매립</text>
  <text x="275" y="468" font-size="12" fill="#999" text-anchor="middle">거주 중 · 석고보드벽</text>

  <!-- 콘크리트 까대기 매립 15~30 -->
  <rect x="385" y="240" width="90" height="90" rx="4" fill="#C26B4A"/>
  <text x="430" y="230" font-size="16" fill="#a8512f" text-anchor="middle">15~30</text>
  <text x="430" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">콘크리트 까대기 매립</text>
  <text x="430" y="468" font-size="12" fill="#999" text-anchor="middle">거주 중 · 도배 보수 포함</text>

  <!-- 인테리어 중 묶음 추가 10~15 -->
  <rect x="540" y="330" width="90" height="30" rx="4" fill="#E0A48C"/>
  <text x="585" y="320" font-size="16" fill="#a8512f" text-anchor="middle">10~15</text>
  <text x="585" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">인테리어 중 추가</text>
  <text x="585" y="468" font-size="12" fill="#999" text-anchor="middle">배선·목공·마감 포함</text>

  <!-- 분전반 전용회로 신설 25~50 -->
  <rect x="695" y="120" width="90" height="150" rx="4" fill="#C26B4A"/>
  <text x="740" y="110" font-size="16" fill="#a8512f" text-anchor="middle">25~50</text>
  <text x="740" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">전용회로 신설</text>
  <text x="740" y="468" font-size="12" fill="#999" text-anchor="middle">분전반→가전 단독 배선</text>

  <text x="40" y="492" font-size="12" fill="#aaaaaa">실제 견적 빅데이터 1,000건+ 기준 · 얼마드나</text>
</svg>
