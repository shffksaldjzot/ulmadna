<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="겨울 결로 예방 공사 비용 — 단계별 실제 단가 막대그래프">
  <rect width="720" height="430" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">겨울 결로 예방 공사 비용, 단계가 올라갈수록 이렇게 뜁니다</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 만원 · 방 1칸 또는 1개소 기준 · 외벽 면 수·자재 등급에 따라 변동</text>

  <!-- gridlines 0~350 -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="230" y1="80" x2="230" y2="332"/>
    <line x1="296" y1="80" x2="296" y2="332"/>
    <line x1="361" y1="80" x2="361" y2="332"/>
    <line x1="427" y1="80" x2="427" y2="332"/>
    <line x1="493" y1="80" x2="493" y2="332"/>
    <line x1="559" y1="80" x2="559" y2="332"/>
    <line x1="624" y1="80" x2="624" y2="332"/>
    <line x1="690" y1="80" x2="690" y2="332"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="230" y="350">0</text>
    <text x="296" y="350">50</text>
    <text x="361" y="350">100</text>
    <text x="427" y="350">150</text>
    <text x="493" y="350">200</text>
    <text x="559" y="350">250</text>
    <text x="624" y="350">300</text>
    <text x="690" y="350">350</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="218" y="105">셀프 관리(제거제·문풍지·습도계)</text>
    <text x="218" y="147">탄성코트(베란다 1개소)</text>
    <text x="218" y="189">창틀 코킹·기밀 보강(집 전체)</text>
    <text x="218" y="231">이보드 덧방(방 1칸)</text>
    <text x="218" y="273">아이소핑크 재시공(방 1칸)</text>
    <text x="218" y="315">확장방 입체 단열(우레탄폼)</text>
  </g>

  <g>
    <!-- 셀프 1~3 -->
    <rect x="231" y="89" width="6" height="22" rx="3" fill="#d98b6a"/>
    <text x="245" y="105" font-size="11" fill="#6b5d52">1~3</text>
    <!-- 탄성코트 20~50 -->
    <rect x="256" y="131" width="40" height="22" rx="4" fill="#d98b6a"/>
    <text x="304" y="147" font-size="11" fill="#6b5d52">20~50</text>
    <!-- 창틀 코킹 30~80 -->
    <rect x="269" y="173" width="66" height="22" rx="4" fill="#d98b6a"/>
    <text x="343" y="189" font-size="11" fill="#6b5d52">30~80</text>
    <!-- 이보드 덧방 60~150 -->
    <rect x="309" y="215" width="118" height="22" rx="4" fill="#cf7a55"/>
    <text x="435" y="231" font-size="11" fill="#6b5d52">60~150</text>
    <!-- 아이소핑크 재시공 150~280 -->
    <rect x="427" y="257" width="171" height="22" rx="4" fill="#a84e2c"/>
    <text x="590" y="273" font-size="11" fill="#ffffff" text-anchor="end" font-weight="600">150~280</text>
    <!-- 확장방 입체 단열 200~350 -->
    <rect x="493" y="299" width="197" height="22" rx="4" fill="#a84e2c"/>
    <text x="682" y="315" font-size="11" fill="#ffffff" text-anchor="end" font-weight="600">200~350</text>
  </g>

  <text x="24" y="400" font-size="12" fill="#8a8175">옅은 막대 = 표면·틈새 보강(예방 유지) · 진한 막대 = 벽을 뜯는 근본 단열 — 곰팡이가 이미 번진 뒤엔 제거·항균 50만~120만원이 별도로 추가됩니다</text>
</svg>
