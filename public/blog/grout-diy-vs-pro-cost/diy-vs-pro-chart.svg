<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="줄눈 셀프 시공 vs 업체 시공 비용 비교 — 욕실 바닥 1칸 기준">
  <style>
    .t { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #333; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12px; fill: #777; }
    .lab { font-size: 13px; }
    .val { font-size: 13px; font-weight: 700; }
    .axis { stroke: #ddd; stroke-width: 1; }
  </style>
  <rect width="720" height="420" fill="#fff"/>
  <text x="24" y="34" class="t title">줄눈 셀프 시공 vs 업체 시공 — 욕실 바닥 1칸 비용 범위</text>
  <text x="24" y="54" class="t sub">가로 막대 = 최소~최대 금액 (원). 실제 구매가·견적 빅데이터 기준.</text>

  <!-- axis grid: 0 ~ 400,000원, x from 200 to 680 (480px) -->
  <g class="axis">
    <line x1="200" y1="80" x2="200" y2="360"/>
    <line x1="320" y1="80" x2="320" y2="360"/>
    <line x1="440" y1="80" x2="440" y2="360"/>
    <line x1="560" y1="80" x2="560" y2="360"/>
    <line x1="680" y1="80" x2="680" y2="360"/>
  </g>
  <g class="t sub">
    <text x="200" y="378" text-anchor="middle">0</text>
    <text x="320" y="378" text-anchor="middle">10만</text>
    <text x="440" y="378" text-anchor="middle">20만</text>
    <text x="560" y="378" text-anchor="middle">30만</text>
    <text x="680" y="378" text-anchor="middle">40만</text>
  </g>

  <!-- 1: 셀프 보수펜/코팅 4,000~10,000 -->
  <text x="188" y="108" class="t lab" text-anchor="end">셀프 ① 보수펜·코팅</text>
  <rect x="200" y="94" width="12" height="20" rx="3" fill="#9aa7b2"/>
  <rect x="200" y="94" width="5" height="20" rx="2" fill="#6b7883"/>
  <text x="220" y="109" class="t val">4천~1만원</text>

  <!-- 2: 셀프 보수제 덧바르기 10,000~20,000 -->
  <text x="188" y="160" class="t lab" text-anchor="end">셀프 ② 보수제 덧바르기</text>
  <rect x="200" y="146" width="24" height="20" rx="3" fill="#9aa7b2"/>
  <rect x="200" y="146" width="12" height="20" rx="2" fill="#6b7883"/>
  <text x="232" y="161" class="t val">1만~2만원</text>

  <!-- 3: 셀프 파내기+2액형 30,000~50,000 -->
  <text x="188" y="212" class="t lab" text-anchor="end">셀프 ③ 파내기+2액형</text>
  <rect x="200" y="198" width="60" height="20" rx="3" fill="#9aa7b2"/>
  <rect x="200" y="198" width="36" height="20" rx="2" fill="#6b7883"/>
  <text x="268" y="213" class="t val">3만~5만원</text>

  <!-- 4: 업체 폴리우레아 100,000~200,000 -->
  <text x="188" y="264" class="t lab" text-anchor="end">업체 폴리우레아</text>
  <rect x="200" y="250" width="240" height="20" rx="3" fill="#e8b4a0"/>
  <rect x="200" y="250" width="120" height="20" rx="2" fill="#c96f4a"/>
  <text x="448" y="265" class="t val">10만~20만원</text>

  <!-- 5: 업체 에폭시 300,000~400,000 -->
  <text x="188" y="316" class="t lab" text-anchor="end">업체 에폭시(케라폭시)</text>
  <rect x="200" y="302" width="480" height="20" rx="3" fill="#e8b4a0"/>
  <rect x="200" y="302" width="360" height="20" rx="2" fill="#c96f4a"/>
  <text x="560" y="297" class="t val" text-anchor="end">30만~40만원</text>

  <text x="24" y="405" class="t sub">진한 부분 = 최소, 연한 부분 = 최대. 셀프는 재료비만이며 시간·노동은 별도.</text>
</svg>
