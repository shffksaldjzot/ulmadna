<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 13px; fill: #6b7280; }
    .q { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .qd { font-size: 12px; fill: #6b7280; }
    .arrow { stroke: #9ca3af; stroke-width: 1.8; fill: none; }
    .alabel { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .out { font-size: 14px; font-weight: 700; }
    .outd { font-size: 12px; fill: #4b5563; }
  </style>

  <rect width="800" height="570" fill="#ffffff"/>
  <text x="40" y="44" class="title">인테리어 계약금 환불 — 30초 판단 순서</text>
  <text x="40" y="68" class="sub">해지 통보하기 전에, 이 순서로 내 상황부터 확인하세요</text>

  <!-- Q1 -->
  <rect x="40" y="96" width="420" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
  <text x="62" y="124" class="q">① 공사에 이미 착수했나요?</text>
  <text x="62" y="146" class="qd">철거 시작 · 자재 발주 · 실측/도면 작업도 착수로 봅니다</text>

  <path class="arrow" d="M 460 129 L 512 129" marker-end="none"/>
  <path d="M 512 129 l -8 -5 v 10 z" fill="#9ca3af"/>
  <text x="478" y="120" class="alabel">예</text>

  <rect x="520" y="88" width="240" height="84" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="540" y="116" class="out" fill="#374151">기성고 정산</text>
  <text x="540" y="138" class="outd">진행된 공정과 실제 지출을 뺀</text>
  <text x="540" y="156" class="outd">나머지 금액의 반환을 협상</text>

  <path class="arrow" d="M 250 162 L 250 206"/>
  <path d="M 250 206 l -5 -8 h 10 z" fill="#9ca3af"/>
  <text x="262" y="190" class="alabel">아니오</text>

  <!-- Q2 -->
  <rect x="40" y="210" width="420" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
  <text x="62" y="238" class="q">② 해지 이유가 업체 잘못인가요?</text>
  <text x="62" y="260" class="qd">착공 지연 · 연락두절 · 무면허 · 계약과 다른 내용 제시</text>

  <path class="arrow" d="M 460 243 L 512 243"/>
  <path d="M 512 243 l -8 -5 v 10 z" fill="#9ca3af"/>
  <text x="478" y="234" class="alabel">예</text>

  <rect x="520" y="198" width="240" height="92" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="540" y="226" class="out" fill="#166534">전액 반환 + 배상 청구</text>
  <text x="540" y="248" class="outd">계약금을 전부 돌려받고,</text>
  <text x="540" y="266" class="outd">총공사비 10% 배상까지 청구 가능</text>

  <path class="arrow" d="M 250 276 L 250 320"/>
  <path d="M 250 320 l -5 -8 h 10 z" fill="#9ca3af"/>
  <text x="262" y="304" class="alabel">아니오 — 단순 변심</text>

  <!-- Outcome C -->
  <rect x="40" y="324" width="720" height="104" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="62" y="356" font-size="16" font-weight="700" fill="#c2410c">위약금 기준은 '총공사비의 10%'입니다</text>
  <text x="62" y="380" class="outd">계약금을 20~30% 냈더라도, 착수 전 해지에서 물어낼 기준선은 총공사비의 10%.</text>
  <text x="62" y="400" class="outd">10%를 넘는 금액은 반환을 요구할 근거가 있습니다. (소비자분쟁해결기준 · 착수 전)</text>

  <!-- Example -->
  <rect x="40" y="452" width="720" height="76" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="62" y="482" font-size="13.5" font-weight="700" fill="#374151">예시 — 총공사비 3,000만원, 계약금 600만원(20%)을 낸 뒤 착수 전 단순 변심 해지</text>
  <text x="62" y="506" font-size="12.5" fill="#6b7280">위약금 기준 300만원(총액의 10%) → 나머지 300만원은 반환 협상 대상</text>
</svg>
