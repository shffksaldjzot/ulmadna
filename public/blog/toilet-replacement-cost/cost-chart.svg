<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="470" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">변기 교체 비용 — 종류별 범위</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 견적 빅데이터 기준 · 제품+시공 총액 (단위: 만원)</text>

  <!-- grid : x = 150 + 만원*5.4 -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="385"/>
    <line x1="258" y1="95" x2="258" y2="385"/>
    <line x1="366" y1="95" x2="366" y2="385"/>
    <line x1="474" y1="95" x2="474" y2="385"/>
    <line x1="582" y1="95" x2="582" y2="385"/>
    <line x1="690" y1="95" x2="690" y2="385"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="150" y="408">0</text>
    <text x="258" y="408">20만</text>
    <text x="366" y="408">40만</text>
    <text x="474" y="408">60만</text>
    <text x="582" y="408">80만</text>
    <text x="690" y="408">100만</text>
  </g>

  <!-- 시공비(공임)만 5~15 -->
  <text x="138" y="122" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">시공비(공임)만 · 제품 직접 구매 시</text>
  <rect x="177" y="106" width="54" height="22" rx="11" fill="#c96f4a"/>
  <text x="240" y="122" font-size="13" fill="#6b6459">5만~15만</text>

  <!-- 일반 투피스 18~25 -->
  <text x="138" y="180" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">일반 투피스(기본형)</text>
  <rect x="247" y="164" width="38" height="22" rx="11" fill="#b56749"/>
  <text x="294" y="180" font-size="13" fill="#6b6459">18만~25만</text>

  <!-- 치마형 투피스 24~35 -->
  <text x="138" y="238" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">치마형 투피스(선호 1위)</text>
  <rect x="280" y="222" width="59" height="22" rx="11" fill="#a3624f"/>
  <text x="348" y="238" font-size="13" fill="#6b6459">24만~35만</text>

  <!-- 원피스 35~55 -->
  <text x="138" y="296" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">원피스(일체형·고급형)</text>
  <rect x="339" y="280" width="108" height="22" rx="11" fill="#8f5a4a"/>
  <text x="456" y="296" font-size="13" fill="#6b6459">35만~55만</text>

  <!-- 비데일체형 60~100+ -->
  <text x="138" y="354" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">비데일체형(스마트)</text>
  <rect x="474" y="338" width="216" height="22" rx="11" fill="#7d5346"/>
  <text x="582" y="333" font-size="13" fill="#6b6459">60만~100만+</text>

  <text x="40" y="446" font-size="12.5" fill="#8a8378">※ 같은 "변기 1식"이라도 제품 등급·철거 폐기 포함 여부·현장 조건에 따라 견적이 두 배까지 벌어집니다.</text>
</svg>
