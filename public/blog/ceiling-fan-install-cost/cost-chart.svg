<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" role="img" aria-label="실링팬 설치 비용 항목별 실제 단가 가로 막대그래프">
  <rect width="800" height="520" fill="#ffffff"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#2b2b2b">실링팬 설치 비용 — 항목별 실제 단가</text>
  <text x="40" y="74" font-size="15" fill="#8a8a8a">제품비 별도 · 실제 견적·시공 사례 기준 · 단위: 만원</text>

  <!-- baseline -->
  <line x1="250" y1="95" x2="250" y2="425" stroke="#dddddd" stroke-width="2"/>

  <!-- 출장비 3만 -->
  <text x="238" y="128" font-size="15" font-weight="600" fill="#444" text-anchor="end">출장비</text>
  <rect x="250" y="110" width="48" height="26" rx="4" fill="#C26B4A"/>
  <text x="308" y="128" font-size="15" fill="#a8512f">약 3만</text>

  <!-- 기본 설치 1대 5~10만 -->
  <text x="238" y="183" font-size="15" font-weight="600" fill="#444" text-anchor="end">기본 설치 (1대)</text>
  <rect x="250" y="165" width="160" height="26" rx="4" fill="#C26B4A"/>
  <text x="420" y="183" font-size="15" fill="#a8512f">5만~10만</text>

  <!-- 천장 보강 약 10만 -->
  <text x="238" y="238" font-size="15" font-weight="600" fill="#444" text-anchor="end">천장 보강 (합판)</text>
  <rect x="250" y="220" width="160" height="26" rx="4" fill="#C26B4A"/>
  <text x="420" y="238" font-size="15" fill="#a8512f">약 10만</text>

  <!-- 전기 배선·상시전원 5~15만 -->
  <text x="238" y="293" font-size="15" font-weight="600" fill="#444" text-anchor="end">전기 배선·상시전원</text>
  <rect x="250" y="275" width="240" height="26" rx="4" fill="#C26B4A"/>
  <text x="500" y="293" font-size="15" fill="#a8512f">5만~15만</text>

  <!-- 다운라이트 8개 20~24만 -->
  <text x="238" y="348" font-size="15" font-weight="600" fill="#444" text-anchor="end">다운라이트 8개</text>
  <rect x="250" y="330" width="384" height="26" rx="4" fill="#C26B4A"/>
  <text x="644" y="348" font-size="15" fill="#a8512f">20만~24만</text>

  <!-- 우물천장 부분 도배 약 25만 -->
  <text x="238" y="403" font-size="15" font-weight="600" fill="#444" text-anchor="end">우물천장 부분 도배</text>
  <rect x="250" y="385" width="400" height="26" rx="4" fill="#C26B4A"/>
  <text x="660" y="403" font-size="15" fill="#a8512f">약 25만</text>

  <text x="40" y="462" font-size="13" fill="#a0a0a0">※ 실링팬 제품비 별도(보급형 10만~30만 · 중급 30만~70만 · 프리미엄 70만~150만+).</text>
  <text x="40" y="484" font-size="13" fill="#a0a0a0">※ 실전 조합 사례: 보강+설치+다운라이트 8개 약 33만 / 보강+설치+다운라이트 12개+도배 약 69만.</text>
</svg>
