<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="500" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">인테리어 필름 셀프 시공 vs 업체 — 부위별 비용</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 셀프 시공 사례·견적 데이터 기준 (단위: 만원)</text>

  <!-- grid : x = 150 + 만원*2.57 -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="410"/>
    <line x1="278" y1="95" x2="278" y2="410"/>
    <line x1="407" y1="95" x2="407" y2="410"/>
    <line x1="535" y1="95" x2="535" y2="410"/>
    <line x1="664" y1="95" x2="664" y2="410"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="150" y="432">0</text>
    <text x="278" y="432">50만</text>
    <text x="407" y="432">100만</text>
    <text x="535" y="432">150만</text>
    <text x="664" y="432">200만</text>
  </g>

  <!-- 싱크대 도어 15개 -->
  <text x="138" y="126" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">싱크대 도어 15개 · 셀프 재료비</text>
  <rect x="150" y="110" width="18" height="22" rx="9" fill="#c96f4a"/>
  <text x="178" y="126" font-size="13" fill="#6b6459">약 6만2천원 (필름 5만5천+프라이머 7천)</text>

  <text x="138" y="178" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">싱크대 상하부장 · 업체</text>
  <rect x="278" y="162" width="78" height="22" rx="11" fill="#7d5346"/>
  <text x="366" y="178" font-size="13" fill="#6b6459">50만~80만원</text>

  <!-- 방문+문틀 1틀 -->
  <text x="138" y="240" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">방문 1짝 · 셀프 재료비</text>
  <rect x="166" y="224" width="16" height="22" rx="8" fill="#c96f4a"/>
  <text x="192" y="240" font-size="13" fill="#6b6459">약 8만~10만원 (방염필름·여유분 포함)</text>

  <text x="138" y="292" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">방문+문틀 1틀 · 업체</text>
  <rect x="187" y="276" width="16" height="22" rx="8" fill="#7d5346"/>
  <text x="213" y="292" font-size="13" fill="#6b6459">15만~20만원</text>

  <!-- 집 전체 문·수납장 7짝 -->
  <text x="138" y="354" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">문·수납장 7짝 · 셀프 재료비</text>
  <rect x="307" y="338" width="20" height="22" rx="10" fill="#c96f4a"/>
  <text x="337" y="354" font-size="13" fill="#6b6459">약 65만원 (방염필름 기준)</text>

  <text x="138" y="406" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">문·수납장 7짝 · 업체 견적</text>
  <rect x="650" y="390" width="40" height="22" rx="11" fill="#7d5346"/>
  <text x="644" y="406" font-size="13" fill="#6b6459" text-anchor="end">200만원 이상</text>

  <text x="40" y="466" font-size="12.5" fill="#8a8378">※ 차이의 정체는 인건비입니다. 필름 견적의 70~80%가 사람 손값이라, 셀프는 그 인건비를 내 시간·노동으로 치릅니다.</text>
</svg>
