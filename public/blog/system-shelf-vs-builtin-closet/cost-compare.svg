<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Pretendard, 'Noto Sans KR', Apple SD Gothic Neo, sans-serif" role="img" aria-label="드레스룸 크기별 시스템행거 vs 붙박이장 실제 비용: 소형(1.5평 내외) 시스템행거 35만~70만원 vs 붙박이장 150만~200만원, 중형(3~4평) 시스템행거 100만~180만원 vs 붙박이장 200만~280만원, 대형(5평 이상) 시스템행거 200만~300만원 vs 붙박이장 300만~500만원">
  <rect width="820" height="400" fill="#fffdf9"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#2b2b2b">드레스룸 크기별 시스템행거 vs 붙박이장 실제 비용</text>
  <text x="30" y="64" font-size="13" fill="#777">실제 견적 데이터 기준 · 구간 중간값으로 표시 · 단위: 만원</text>

  <!-- legend -->
  <rect x="30" y="82" width="14" height="14" rx="2" fill="#c8623d"/>
  <text x="50" y="94" font-size="13" fill="#444">시스템행거</text>
  <rect x="150" y="82" width="14" height="14" rx="2" fill="#d9cbb8"/>
  <text x="170" y="94" font-size="13" fill="#444">붙박이장</text>

  <!-- axis -->
  <line x1="230" y1="112" x2="230" y2="380" stroke="#ddd"/>
  <line x1="230" y1="380" x2="790" y2="380" stroke="#ddd"/>
  <g font-size="11" fill="#999">
    <text x="479" y="398" text-anchor="middle">200</text>
    <line x1="479" y1="112" x2="479" y2="380" stroke="#eee"/>
    <text x="728" y="398" text-anchor="middle">400</text>
    <line x1="728" y1="112" x2="728" y2="380" stroke="#eee"/>
  </g>

  <!-- 1. 소형 -->
  <text x="220" y="140" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">소형 · 1.5평 내외</text>
  <text x="220" y="158" font-size="11" fill="#888" text-anchor="end">원룸·전세 옷방</text>
  <rect x="230" y="122" width="62" height="20" fill="#c8623d"/>
  <text x="298" y="137" font-size="13" font-weight="700" fill="#c8623d">35만~70만</text>
  <rect x="230" y="146" width="218" height="20" fill="#d9cbb8"/>
  <text x="454" y="161" font-size="13" font-weight="600" fill="#555">150만~200만</text>

  <!-- 2. 중형 -->
  <text x="220" y="220" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">중형 · 3~4평</text>
  <text x="220" y="238" font-size="11" fill="#888" text-anchor="end">부부 드레스룸</text>
  <rect x="230" y="202" width="174" height="20" fill="#c8623d"/>
  <text x="410" y="217" font-size="13" font-weight="700" fill="#c8623d">100만~180만</text>
  <rect x="230" y="226" width="299" height="20" fill="#d9cbb8"/>
  <text x="535" y="241" font-size="13" font-weight="600" fill="#555">200만~280만</text>

  <!-- 3. 대형 -->
  <text x="220" y="300" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">대형 · 5평 이상</text>
  <text x="220" y="318" font-size="11" fill="#888" text-anchor="end">4인 가족·자가 장기거주</text>
  <rect x="230" y="282" width="311" height="20" fill="#c8623d"/>
  <text x="547" y="297" font-size="13" font-weight="700" fill="#c8623d">200만~300만</text>
  <rect x="230" y="306" width="498" height="20" fill="#d9cbb8"/>
  <text x="732" y="321" font-size="13" font-weight="600" fill="#555">300만~500만</text>
</svg>
