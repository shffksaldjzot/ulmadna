<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="30평대 아파트 인테리어 공정별 비용 범위 막대그래프">
  <rect width="720" height="430" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">30평대(74~84타입) 공정별 비용 범위</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 만원 · 막대가 길수록 자재·사양에 따라 폭이 큰 공정</text>

  <!-- gridlines 0~1500 -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="200" y1="80" x2="200" y2="360"/>
    <line x1="296" y1="80" x2="296" y2="360"/>
    <line x1="392" y1="80" x2="392" y2="360"/>
    <line x1="488" y1="80" x2="488" y2="360"/>
    <line x1="584" y1="80" x2="584" y2="360"/>
    <line x1="680" y1="80" x2="680" y2="360"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="200" y="378">0</text>
    <text x="296" y="378">300</text>
    <text x="392" y="378">600</text>
    <text x="488" y="378">900</text>
    <text x="584" y="378">1,200</text>
    <text x="680" y="378">1,500</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="188" y="105">철거</text>
    <text x="188" y="139">도배(실크)</text>
    <text x="188" y="173">강마루</text>
    <text x="188" y="207">조명·전기</text>
    <text x="188" y="241">포세린 타일 바닥</text>
    <text x="188" y="275">붙박이·맞춤가구</text>
    <text x="188" y="309">욕실 2곳</text>
    <text x="188" y="343">주방</text>
  </g>

  <g>
    <!-- 철거 150~300 -->
    <rect x="248" y="91" width="48" height="20" rx="4" fill="#d98b6a"/>
    <text x="302" y="106" font-size="11" fill="#6b5d52">150~300</text>
    <!-- 도배 150~250 -->
    <rect x="248" y="125" width="32" height="20" rx="4" fill="#d98b6a"/>
    <text x="286" y="140" font-size="11" fill="#6b5d52">150~250</text>
    <!-- 강마루 250~450 -->
    <rect x="280" y="159" width="64" height="20" rx="4" fill="#cf7a55"/>
    <text x="350" y="174" font-size="11" fill="#6b5d52">250~450</text>
    <!-- 조명·전기 100~300 -->
    <rect x="232" y="193" width="64" height="20" rx="4" fill="#cf7a55"/>
    <text x="302" y="208" font-size="11" fill="#6b5d52">100~300</text>
    <!-- 포세린 500~800 -->
    <rect x="360" y="227" width="96" height="20" rx="4" fill="#c0653f"/>
    <text x="462" y="242" font-size="11" fill="#6b5d52">500~800</text>
    <!-- 가구 300~1000 -->
    <rect x="296" y="261" width="224" height="20" rx="4" fill="#c0653f"/>
    <text x="526" y="276" font-size="11" fill="#6b5d52">300~1,000</text>
    <!-- 욕실2 600~1200 -->
    <rect x="392" y="295" width="192" height="20" rx="4" fill="#a84e2c"/>
    <text x="590" y="310" font-size="11" fill="#6b5d52">600~1,200</text>
    <!-- 주방 500~1500 -->
    <rect x="360" y="329" width="320" height="20" rx="4" fill="#a84e2c"/>
    <text x="672" y="344" font-size="11" fill="#fbeee7" text-anchor="end">500~1,500</text>
  </g>

  <text x="24" y="406" font-size="12" fill="#8a8175">※ 폭이 큰 주방·욕실·가구는 "사양을 낮추면" 가장 크게 줄어드는 곳, 폭이 좁은 도배·철거는 "범위"로 줄이는 곳.</text>
  <text x="24" y="422" font-size="12" fill="#8a8175">※ 강마루와 포세린 타일은 바닥 마감 선택지 비교용이며 함께 더하는 금액이 아닙니다.</text>
</svg>
