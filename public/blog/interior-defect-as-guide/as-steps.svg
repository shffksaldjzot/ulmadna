<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <style>
    text { word-break: keep-all; }
    .title { font-size: 20px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 13px; fill: #6b7280; }
    .step { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .desc { font-size: 12.5px; fill: #4b5563; }
    .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .tip { font-size: 12.5px; fill: #6b7280; }
  </style>

  <rect width="800" height="520" fill="#ffffff"/>
  <text x="40" y="44" class="title">하자보수 요청, 이 순서로 한 칸씩만 올리세요</text>
  <text x="40" y="68" class="sub">아래 단계에서 해결되면 거기서 끝 — 감정 대신 기록으로 올라가는 사다리</text>

  <!-- 연결선 -->
  <line x1="66" y1="112" x2="66" y2="462" stroke="#e5e7eb" stroke-width="2"/>

  <!-- 1단계 -->
  <circle cx="66" cy="118" r="16" fill="#0d9488"/>
  <text x="66" y="123.5" text-anchor="middle" class="num">1</text>
  <rect x="96" y="94" width="664" height="50" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="114" y="115" class="step">기록 — 날짜 나오게 사진·영상부터</text>
  <text x="114" y="134" class="desc">하자 부위 전체샷 + 근접샷, 발견일 메모. "언제 생겼나" 다툼에서 이기는 유일한 증거</text>

  <!-- 2단계 -->
  <circle cx="66" cy="188" r="16" fill="#0d9488"/>
  <text x="66" y="193.5" text-anchor="middle" class="num">2</text>
  <rect x="96" y="164" width="664" height="50" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="114" y="185" class="step">서면 접수 — 전화 말고 문자·메일로</text>
  <text x="114" y="204" class="desc">하자 위치·사진·현장 확인 요청일 명시. 전화 통화는 기록이 안 남아 접수 증거가 못 됨</text>

  <!-- 3단계 -->
  <circle cx="66" cy="258" r="16" fill="#f59e0b"/>
  <text x="66" y="263.5" text-anchor="middle" class="num">3</text>
  <rect x="96" y="234" width="664" height="50" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="114" y="255" class="step">내용증명 — 답이 없으면 공식 문서로</text>
  <text x="114" y="274" class="desc">하자 내용 + 보수 기한 + 불이행 시 절차(조정·소송 의사)를 구체적으로. 우체국·인터넷으로 발송</text>

  <!-- 4단계 -->
  <circle cx="66" cy="328" r="16" fill="#ea580c"/>
  <text x="66" y="333.5" text-anchor="middle" class="num">4</text>
  <rect x="96" y="304" width="664" height="50" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="114" y="325" class="step">보증기관·기관 구제 — 업체를 건너뛰는 단계</text>
  <text x="114" y="344" class="desc">하자이행보증증권 있으면 보증기관에 직접 청구, 없으면 1372 소비자상담 → 소비자원 피해구제</text>

  <!-- 5단계 -->
  <circle cx="66" cy="398" r="16" fill="#dc2626"/>
  <text x="66" y="403.5" text-anchor="middle" class="num">5</text>
  <rect x="96" y="374" width="664" height="50" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="114" y="395" class="step">법적 절차 — 하자보수·손해배상 청구</text>
  <text x="114" y="414" class="desc">민사 청구 + 필요 시 건축 전문 감정으로 하자 원인 입증. 1~4단계 기록이 전부 증거가 됨</text>

  <!-- 하단 박스 -->
  <rect x="40" y="448" width="720" height="48" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="468" font-size="13px" font-weight="700" fill="#374151">핵심은 순서입니다 — 1·2단계 기록 없이 4·5단계로 바로 가면 증거가 없어 집니다.</text>
  <text x="60" y="487" class="tip">대부분의 분쟁은 2~3단계(서면 접수·내용증명)에서 끝납니다. 문서가 쌓일수록 업체가 움직입니다.</text>
</svg>
