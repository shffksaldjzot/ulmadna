<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="욕실 타일 덧방 비용과 철거 후 재시공 비용 범위 비교 막대그래프">
  <rect width="720" height="360" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">욕실 1칸 — 덧방 vs 올철거 비용 범위</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 만원 · 타일+도기+천장 포함 패키지 기준, 부가세·옵션 별도</text>

  <!-- gridlines -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="170" y1="80" x2="170" y2="300"/>
    <line x1="239" y1="80" x2="239" y2="300"/>
    <line x1="309" y1="80" x2="309" y2="300"/>
    <line x1="378" y1="80" x2="378" y2="300"/>
    <line x1="447" y1="80" x2="447" y2="300"/>
    <line x1="517" y1="80" x2="517" y2="300"/>
    <line x1="586" y1="80" x2="586" y2="300"/>
    <line x1="655" y1="80" x2="655" y2="300"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="170" y="318">0</text>
    <text x="239" y="318">100</text>
    <text x="309" y="318">200</text>
    <text x="378" y="318">300</text>
    <text x="447" y="318">400</text>
    <text x="517" y="318">500</text>
    <text x="586" y="318">600</text>
    <text x="655" y="318">700</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="158" y="110">덧방 실속형</text>
    <text x="158" y="160">덧방 중급형</text>
    <text x="158" y="210">올철거 기본형</text>
    <text x="158" y="260">올철거 중급형</text>
  </g>

  <!-- bars -->
  <rect x="330" y="94" width="34" height="22" rx="4" fill="#d9a98f"/>
  <rect x="399" y="144" width="83" height="22" rx="4" fill="#d9a98f"/>
  <rect x="413" y="194" width="104" height="22" rx="4" fill="#b6584a"/>
  <rect x="517" y="244" width="138" height="22" rx="4" fill="#b6584a"/>

  <!-- value labels -->
  <g font-size="12" fill="#2b2b2b" font-weight="600">
    <text x="370" y="110">230~280</text>
    <text x="488" y="160">330~450</text>
    <text x="523" y="210">350~500</text>
    <text x="661" y="260" text-anchor="end" fill="#ffffff">500~700</text>
  </g>

  <!-- legend -->
  <rect x="24" y="336" width="12" height="12" rx="2" fill="#d9a98f"/>
  <text x="42" y="346" font-size="11" fill="#6b6259">덧방(기존 타일 위 시공)</text>
  <rect x="190" y="336" width="12" height="12" rx="2" fill="#b6584a"/>
  <text x="208" y="346" font-size="11" fill="#6b6259">올철거+방수 재시공</text>
  <text x="696" y="346" font-size="11" fill="#a89e92" text-anchor="end">실제 견적 빅데이터 1,000건+ 기준</text>
</svg>
