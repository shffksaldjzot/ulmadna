<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" role="img" aria-label="인덕션 전용선 설치 비용 방식별 가격 범위 막대그래프 — 차단기 개별 교체, 노출 설치기사 정찰, 노출 전기업체 견적, 매립 설치기사 정찰, 매립 전기업체 견적">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#2b2b2b">인덕션 전용선 설치 비용 — 경로별 가격 범위</text>
  <text x="40" y="74" font-size="15" fill="#8a8a8a">설치기사 정찰가 vs 전기업체 견적 · 10m 기준 · 단위: 만원</text>

  <!-- baseline -->
  <line x1="40" y1="420" x2="830" y2="420" stroke="#dddddd" stroke-width="2"/>

  <!-- 차단기 개별 교체 2~4 -->
  <rect x="90" y="392" width="80" height="28" rx="4" fill="#C26B4A"/>
  <text x="130" y="384" font-size="16" fill="#a8512f" text-anchor="middle">2~4</text>
  <text x="130" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">차단기 개별 교체</text>
  <text x="130" y="468" font-size="12" fill="#999" text-anchor="middle">설치기사 정찰</text>

  <!-- 노출 설치기사 10 -->
  <rect x="235" y="350" width="80" height="70" rx="4" fill="#C26B4A"/>
  <text x="275" y="342" font-size="16" fill="#a8512f" text-anchor="middle">10</text>
  <text x="275" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">노출 전용선</text>
  <text x="275" y="468" font-size="12" fill="#999" text-anchor="middle">설치기사 정찰(10m)</text>

  <!-- 노출 전기업체 10~25 -->
  <rect x="380" y="245" width="80" height="175" rx="4" fill="#C26B4A"/>
  <text x="420" y="237" font-size="16" fill="#a8512f" text-anchor="middle">10~25</text>
  <text x="420" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">노출 전용선</text>
  <text x="420" y="468" font-size="12" fill="#999" text-anchor="middle">전기업체(거주 중)</text>

  <!-- 매립 설치기사 35 -->
  <rect x="525" y="175" width="80" height="245" rx="4" fill="#C26B4A"/>
  <text x="565" y="167" font-size="16" fill="#a8512f" text-anchor="middle">35</text>
  <text x="565" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">매립 전용선</text>
  <text x="565" y="468" font-size="12" fill="#999" text-anchor="middle">설치기사 정찰(10m)</text>

  <!-- 매립 전기업체 25~45 -->
  <rect x="670" y="105" width="80" height="315" rx="4" fill="#C26B4A"/>
  <text x="710" y="97" font-size="16" fill="#a8512f" text-anchor="middle">25~45</text>
  <text x="710" y="448" font-size="15" font-weight="600" fill="#444" text-anchor="middle">매립 전용선</text>
  <text x="710" y="468" font-size="12" fill="#999" text-anchor="middle">전기업체(인테리어 중)</text>

  <text x="40" y="492" font-size="13" fill="#a0a0a0">※ 설치기사 정찰가는 10m 초과 시 노출 m당 5천원·매립 구간가산. 전기업체 견적은 거리·노후도에 따라 변동. 실제 견적 빅데이터 기준.</text>
</svg>
