<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="470" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">욕실 수전 교체 비용 — 방식별 범위</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 견적 빅데이터 기준 · 제품+공임 (단위: 만원)</text>

  <!-- grid : x = 150 + 만원*21.6 -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="385"/>
    <line x1="258" y1="95" x2="258" y2="385"/>
    <line x1="366" y1="95" x2="366" y2="385"/>
    <line x1="474" y1="95" x2="474" y2="385"/>
    <line x1="582" y1="95" x2="582" y2="385"/>
    <line x1="690" y1="95" x2="690" y2="385"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="150" y="408">0</text>
    <text x="258" y="408">5만</text>
    <text x="366" y="408">10만</text>
    <text x="474" y="408">15만</text>
    <text x="582" y="408">20만</text>
    <text x="690" y="408">25만</text>
  </g>

  <!-- 세면대 셀프 3~7 -->
  <text x="138" y="122" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">세면대 수전 셀프(제품값만)</text>
  <rect x="215" y="106" width="86" height="22" rx="11" fill="#c96f4a"/>
  <text x="310" y="122" font-size="13" fill="#6b6459">3만~7만</text>

  <!-- 세면대 반셀프 8~13 -->
  <text x="138" y="180" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">세면대 수전 제품 직접 구매+공임</text>
  <rect x="323" y="164" width="108" height="22" rx="11" fill="#b56749"/>
  <text x="440" y="180" font-size="13" fill="#6b6459">8만~13만</text>

  <!-- 세면대 업체 일괄 8~15 -->
  <text x="138" y="238" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">세면대 수전 업체 일괄</text>
  <rect x="323" y="222" width="151" height="22" rx="11" fill="#a3624f"/>
  <text x="483" y="238" font-size="13" fill="#6b6459">8만~15만 (고급 브랜드 20만+)</text>

  <!-- 일반 샤워 수전 8~13 -->
  <text x="138" y="296" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">일반 샤워 수전(제품+설치)</text>
  <rect x="323" y="280" width="108" height="22" rx="11" fill="#b56749"/>
  <text x="440" y="296" font-size="13" fill="#6b6459">8만~13만 (공임만 맡기면 5만대)</text>

  <!-- 해바라기 샤워 수전 15~25 -->
  <text x="138" y="354" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">해바라기 샤워 수전(제품+설치)</text>
  <rect x="474" y="338" width="216" height="22" rx="11" fill="#7d5346"/>
  <text x="582" y="333" font-size="13" fill="#6b6459">15만~25만 (20만 전후)</text>

  <text x="40" y="446" font-size="12.5" fill="#8a8378">※ 제품값보다 시공 난이도가 가격을 정합니다. 같은 자리·같은 방식 교체는 싸고, 타공·배관을 건드리면 올라갑니다.</text>
</svg>
