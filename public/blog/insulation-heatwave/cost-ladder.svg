<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="폭염 대책 단계별 비용 사다리 — 차열 필름 가격부터 샷시 교체까지">
  <rect width="720" height="430" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">폭염 대책, 단계별로 얼마나 들까</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">아래로 갈수록 비용↑ 효과 범위↑ · 실제 견적 빅데이터 기준 · 금액은 범위</text>

  <!-- step 1 -->
  <g>
    <rect x="24" y="88" width="240" height="64" rx="10" fill="#e8b399"/>
    <text x="40" y="114" font-size="14" font-weight="700" fill="#4a3527">1단계 · 셀프 차열 필름</text>
    <text x="40" y="136" font-size="12" fill="#6b5d52">창 1짝 1만~5만원 · 당일 부착</text>
    <text x="280" y="124" font-size="12" fill="#8a8175">창으로 드는 태양열부터 줄인다</text>
  </g>

  <!-- step 2 -->
  <g>
    <rect x="80" y="168" width="280" height="64" rx="10" fill="#d98b6a"/>
    <text x="96" y="194" font-size="14" font-weight="700" fill="#3d2317">2단계 · 전문 필름 시공</text>
    <text x="96" y="216" font-size="12" fill="#57392a">집 전체 수십만~100만원대</text>
    <text x="376" y="204" font-size="12" fill="#8a8175">통창·고층·서향 집, 시공 품질↑</text>
  </g>

  <!-- step 3 -->
  <g>
    <rect x="136" y="248" width="320" height="64" rx="10" fill="#cf7a55"/>
    <text x="152" y="274" font-size="14" font-weight="700" fill="#33190e">3단계 · 벽체 차열·단열 보강</text>
    <text x="152" y="296" font-size="12" fill="#4d2c1c">방·확장부 1곳 150만~350만원</text>
    <text x="472" y="284" font-size="12" fill="#8a8175">벽이 뜨거운 집 · 여름 결로까지</text>
  </g>

  <!-- step 4 -->
  <g>
    <rect x="192" y="328" width="360" height="64" rx="10" fill="#a84e2c"/>
    <text x="208" y="354" font-size="14" font-weight="700" fill="#ffffff">4단계 · 로이유리 샷시 교체</text>
    <text x="208" y="376" font-size="12" fill="#f3ddd2">집 전체 600만~1,500만원 (84타입 전체 기준)</text>
    <text x="568" y="364" font-size="12" fill="#8a8175">여름·겨울 다 잡는 근본책</text>
  </g>
</svg>
