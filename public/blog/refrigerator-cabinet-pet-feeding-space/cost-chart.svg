<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="냉장고장 반려동물 공간 비용 구성별 가격 범위">
<rect width="800" height="400" fill="#faf7f2"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#3a2e28" font-family="sans-serif">냉장고장 구성별 비용 범위 (만원, 냉장고 제품값 제외)</text>
<g font-family="sans-serif" font-size="14" fill="#3a2e28">
<text x="20" y="85">부분 리폼</text><rect x="180" y="68" width="60" height="22" fill="#d9a48c"/><text x="250" y="85">30~100</text>
<text x="20" y="130">홈바형 전환</text><rect x="180" y="113" width="120" height="22" fill="#d9a48c"/><text x="310" y="130">78~</text>
<text x="20" y="175">1대 전체 제작</text><rect x="180" y="158" width="160" height="22" fill="#c47a5a"/><text x="350" y="175">80~180</text>
<text x="20" y="220">2대 세트(칸 추가)</text><rect x="180" y="203" width="340" height="22" fill="#c47a5a"/><text x="530" y="220">150~300</text>
<text x="20" y="265">3대·팬트리·키큰장</text><rect x="180" y="248" width="500" height="22" fill="#b0583a"/><text x="690" y="265">250~450</text>
<text x="20" y="310">칸 하나 증가분</text><rect x="180" y="293" width="140" height="22" fill="#6b8f71"/><text x="330" y="310">70~120</text>
<text x="20" y="355">설비 옵션</text><rect x="180" y="338" width="40" height="22" fill="#6b8f71"/><text x="230" y="355">25</text>
</g>
</svg>
