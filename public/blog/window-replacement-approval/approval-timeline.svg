<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="800" height="620" fill="#fdfaf7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#2b2b2b">아파트 샷시 교체 동의 절차 — 시공일 기준 역산 일정</text>
  <text x="40" y="78" font-size="14" fill="#8a8a8a">D-day = 샷시 시공일 · 진한 막대 = 모든 세대 공통 · 연한 막대 = 확장·외관 변경이 붙을 때만</text>

  <!-- axis -->
  <line x1="200" y1="104" x2="200" y2="540" stroke="#e8ddd4" stroke-width="2"/>

  <!-- D-60 -->
  <circle cx="200" cy="130" r="7" fill="#c06b4f"/>
  <text x="120" y="135" font-size="14" font-weight="700" fill="#c06b4f" text-anchor="end">D-60</text>
  <rect x="222" y="118" width="420" height="24" rx="6" fill="#c06b4f"/>
  <text x="234" y="135" font-size="13" font-weight="600" fill="#ffffff">관리사무소 1차 전화 · 관리규약(외관·색상·분할) 확인</text>
  <text x="222" y="160" font-size="12" fill="#8a8a8a">계약·발주 전에 끝내야 제품 선택이 안 꼬입니다 · 확장 동반이면 인접세대 동의서 징구 시작</text>

  <!-- D-30 -->
  <circle cx="200" cy="200" r="7" fill="#c06b4f"/>
  <text x="120" y="205" font-size="14" font-weight="700" fill="#c06b4f" text-anchor="end">D-30</text>
  <rect x="222" y="188" width="380" height="24" rx="6" fill="#c06b4f"/>
  <text x="234" y="205" font-size="13" font-weight="600" fill="#ffffff">창호 사양·외부 색상 확정 → 발주 (제작 2~3주)</text>
  <text x="222" y="230" font-size="12" fill="#8a8a8a">외부 ASA 색상은 공장에서 입혀 나와 주문 뒤 변경 불가 · 규약 확인 뒤에 발주</text>

  <!-- D-21 -->
  <circle cx="200" cy="270" r="7" fill="#d98e6f"/>
  <text x="120" y="275" font-size="14" font-weight="700" fill="#d98e6f" text-anchor="end">D-21</text>
  <rect x="222" y="258" width="450" height="24" rx="6" fill="#d98e6f"/>
  <text x="234" y="275" font-size="13" font-weight="600" fill="#ffffff">구청 행위허가·신고 접수 (확장·비내력벽 철거·형태 변경 시)</text>
  <text x="222" y="300" font-size="12" fill="#8a8a8a">서류 하나 빠지면 반려 → 그만큼 시공일이 밀립니다 · 최소 2~3주 전</text>

  <!-- D-7 -->
  <circle cx="200" cy="340" r="7" fill="#c06b4f"/>
  <text x="120" y="345" font-size="14" font-weight="700" fill="#c06b4f" text-anchor="end">D-7</text>
  <rect x="222" y="328" width="360" height="24" rx="6" fill="#c06b4f"/>
  <text x="234" y="345" font-size="13" font-weight="600" fill="#ffffff">인접세대 동의·양해 완료 · 승강기 사용 신청</text>
  <text x="222" y="370" font-size="12" fill="#8a8a8a">동의서를 요구하는 단지는 이 시점까지 서명이 끝나 있어야 합니다</text>

  <!-- D-5~3 -->
  <circle cx="200" cy="410" r="7" fill="#c06b4f"/>
  <text x="120" y="415" font-size="14" font-weight="700" fill="#c06b4f" text-anchor="end">D-5~3</text>
  <rect x="222" y="398" width="420" height="24" rx="6" fill="#c06b4f"/>
  <text x="234" y="415" font-size="13" font-weight="600" fill="#ffffff">공사신고서 제출 · 안내문 부착 · 보증금·보양 확인</text>
  <text x="222" y="440" font-size="12" fill="#8a8a8a">사다리차 세울 자리·시간대까지 관리사무소와 합의 · 소음 집중 시간 안내문에 명시</text>

  <!-- D-day -->
  <circle cx="200" cy="480" r="9" fill="#2b2b2b"/>
  <text x="120" y="485" font-size="14" font-weight="700" fill="#2b2b2b" text-anchor="end">D-day</text>
  <rect x="222" y="468" width="340" height="24" rx="6" fill="#2b2b2b"/>
  <text x="234" y="485" font-size="13" font-weight="600" fill="#ffffff">보양 → 철거·양중 → 설치 → 외부 코킹</text>
  <text x="222" y="510" font-size="12" fill="#8a8a8a">허용 공사 시간 안에서만 · 공용부 보양 사진 촬영</text>

  <!-- D+3 -->
  <circle cx="200" cy="540" r="7" fill="#c06b4f"/>
  <text x="120" y="545" font-size="14" font-weight="700" fill="#c06b4f" text-anchor="end">D+1~3</text>
  <rect x="222" y="528" width="410" height="24" rx="6" fill="#c06b4f"/>
  <text x="234" y="545" font-size="13" font-weight="600" fill="#ffffff">실리콘 경화 · 아랫집 누수 여부 확인 · 준공 통보</text>
  <text x="222" y="570" font-size="12" fill="#8a8a8a">공사보증금 반환은 공용부 파손 없음이 확인된 뒤</text>

  <line x1="40" y1="586" x2="760" y2="586" stroke="#e8ddd4" stroke-width="1"/>
  <text x="40" y="608" font-size="13" fill="#8a8a8a">얼마드나 · 단순 교체(같은 위치·형태·색)는 D-21 행위허가 단계가 빠집니다</text>
</svg>
