<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="냉장고장 제작 비용 구성별 가격 범위 차트 — 부분 리폼 30만~100만, 홈바장 78만~, 냉장고 1대 전체 제작 80만~180만, 2대 세트 150만~300만, 3대·팬트리·키큰장 세트 250만~450만, 프리미엄 키친핏·도장 400만~700만 이상">
  <style>
    .t { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #2b2622; }
    .lab { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; fill: #7a6f66; }
    .val { font-size: 13px; font-weight: 700; fill: #2b2622; }
    .axis { font-size: 11px; fill: #9a8f86; }
    .title { font-size: 18px; font-weight: 700; }
    .note { font-size: 11px; fill: #9a8f86; }
  </style>
  <rect width="800" height="520" fill="#fbf8f4"/>
  <text x="32" y="38" class="t title">냉장고장 제작 비용 — 구성별 실제 가격 범위</text>
  <text x="32" y="60" class="t sub">일반 업체 기준 · 냉장고 제품값 제외 · 실제 견적 빅데이터 1,000건+ 정리</text>

  <!-- axis: 0 ~ 700만 → x 250..740 (0.7px/만) -->
  <g class="t axis">
    <line x1="250" y1="86" x2="250" y2="470" stroke="#e2d9d0"/>
    <line x1="320" y1="86" x2="320" y2="470" stroke="#eee7df" stroke-dasharray="3 3"/>
    <line x1="390" y1="86" x2="390" y2="470" stroke="#eee7df" stroke-dasharray="3 3"/>
    <line x1="460" y1="86" x2="460" y2="470" stroke="#eee7df" stroke-dasharray="3 3"/>
    <line x1="530" y1="86" x2="530" y2="470" stroke="#eee7df" stroke-dasharray="3 3"/>
    <line x1="600" y1="86" x2="600" y2="470" stroke="#eee7df" stroke-dasharray="3 3"/>
    <line x1="670" y1="86" x2="670" y2="470" stroke="#eee7df" stroke-dasharray="3 3"/>
    <line x1="740" y1="86" x2="740" y2="470" stroke="#eee7df" stroke-dasharray="3 3"/>
    <text x="250" y="488" text-anchor="middle">0</text>
    <text x="320" y="488" text-anchor="middle">100만</text>
    <text x="390" y="488" text-anchor="middle">200만</text>
    <text x="460" y="488" text-anchor="middle">300만</text>
    <text x="530" y="488" text-anchor="middle">400만</text>
    <text x="600" y="488" text-anchor="middle">500만</text>
    <text x="670" y="488" text-anchor="middle">600만</text>
    <text x="740" y="488" text-anchor="middle">700만</text>
  </g>

  <!-- 1. 부분 리폼 30~100 -->
  <text x="32" y="112" class="t lab">① 부분 리폼(기존 장 살림)</text>
  <text x="32" y="130" class="t sub">칸막이 이동 · 수납장 절단 · 상부장 재조립</text>
  <rect x="271" y="98" width="49" height="24" rx="6" fill="#c9a98f"/>
  <text x="328" y="115" class="t val">30만 ~ 100만원</text>

  <!-- 2. 홈바장 78~ -->
  <text x="32" y="176" class="t lab">② 홈바장 제작(수납장 자리)</text>
  <text x="32" y="194" class="t sub">기본형 78만 + 조명·내부수납 옵션</text>
  <rect x="305" y="162" width="28" height="24" rx="6" fill="#c9a98f"/>
  <rect x="333" y="162" width="30" height="24" rx="6" fill="#e6cdbd"/>
  <text x="371" y="179" class="t val">78만원 ~ (옵션별 가산)</text>

  <!-- 3. 냉장고 1대 전체 제작 80~180 -->
  <text x="32" y="240" class="t lab">③ 냉장고 1대 전체 제작</text>
  <text x="32" y="258" class="t sub">철거 후 신규 · PET 기준 · 비스포크·오브제 맞춤</text>
  <rect x="306" y="226" width="70" height="24" rx="6" fill="#d98c6b"/>
  <text x="384" y="243" class="t val">80만 ~ 180만원</text>

  <!-- 4. 2대 세트 150~300 -->
  <text x="32" y="304" class="t lab">④ 냉장고 + 김치냉장고 2대 세트</text>
  <text x="32" y="322" class="t sub">가장 많이 시공되는 구간 200만~300만</text>
  <rect x="355" y="290" width="105" height="24" rx="6" fill="#d98c6b"/>
  <text x="468" y="307" class="t val">150만 ~ 300만원</text>

  <!-- 5. 3대·팬트리·키큰장 세트 250~450 -->
  <text x="32" y="368" class="t lab">⑤ 3대 · 팬트리 · 키큰장 세트</text>
  <text x="32" y="386" class="t sub">34평/84타입 이상 주방에서 흔한 구성</text>
  <rect x="425" y="354" width="140" height="24" rx="6" fill="#b8654a"/>
  <text x="573" y="371" class="t val">250만 ~ 450만원</text>

  <!-- 6. 프리미엄 400~700+ -->
  <text x="32" y="432" class="t lab">⑥ 프리미엄 키친핏 정밀 · 도장 마감</text>
  <text x="32" y="450" class="t sub">우레탄 도장 · 무광 · 완전 빌트인</text>
  <rect x="530" y="418" width="210" height="24" rx="6" fill="#b8654a"/>
  <text x="742" y="435" class="t val" text-anchor="end" fill="#fbf8f4">400만 ~ 700만원+</text>

  <text x="32" y="508" class="t note">※ 콘센트 이동·벽 평탄·상부장 추가·간접조명은 별도 30만~150만원 가산. 공장직영은 같은 구성에서 30~40% 낮게 나오기도 함.</text>
</svg>
