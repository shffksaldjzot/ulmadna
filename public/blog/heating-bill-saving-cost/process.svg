<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="난방비 절약 공사 순서 — 진단, 틈새, 단열·창호, 보일러·배관 4단계">
  <rect width="720" height="250" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">난방비 절약 공사, 열이 새는 순서대로</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">비싼 것부터 하면 손해 · 단위: 만원</text>
  <line x1="60" y1="120" x2="660" y2="120" stroke="#e0d3c7" stroke-width="3"/>
  <g>
    <circle cx="90" cy="120" r="22" fill="#d9a48f"/><text x="90" y="126" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">0</text>
    <circle cx="270" cy="120" r="22" fill="#c97b5c"/><text x="270" y="126" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <circle cx="450" cy="120" r="22" fill="#b5613f"/><text x="450" y="126" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <circle cx="630" cy="120" r="22" fill="#a24f2e"/><text x="630" y="126" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  </g>
  <g font-size="14" font-weight="700" fill="#3a3a3a" text-anchor="middle">
    <text x="90" y="170">진단</text>
    <text x="270" y="170">틈새 막기</text>
    <text x="450" y="170">단열 보강·창호</text>
    <text x="630" y="170">보일러·배관</text>
  </g>
  <g font-size="12" fill="#6b6057" text-anchor="middle">
    <text x="90" y="192">열화상 10~20</text>
    <text x="90" y="210">냉기 부위 확정</text>
    <text x="270" y="192">셀프 1~20</text>
    <text x="270" y="210">한 시즌 안에 회수</text>
    <text x="450" y="192">방 1칸 150~280 / 외부창 600~950</text>
    <text x="450" y="210">난방비를 진짜 줄이는 단계</text>
    <text x="630" y="192">콘덴싱 90~150</text>
    <text x="630" y="210">배관 청소는 같이</text>
  </g>
</svg>
