<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" role="img" aria-label="전기 기사 출장비와 소액 전기 수리 총액 가격 범위 차트 — 기본 출장비, 야간 출장비, 콘센트 교체, 전등 교체, 누전차단기 교체, 분전반 점검, 누전 선로 보수">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#2b2b2b">전기 기사 출장비 — 소액 수리 총액 범위</text>
  <text x="40" y="74" font-size="15" fill="#8a8a8a">인테리어 없이 단독 호출 · 출장비+작업비 합산 · 단위: 만원</text>

  <!-- grid: x scale 0~40만원 → x=300 + v*12.5 -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="300" y1="100" x2="300" y2="480"/>
    <line x1="425" y1="100" x2="425" y2="480"/>
    <line x1="550" y1="100" x2="550" y2="480"/>
    <line x1="675" y1="100" x2="675" y2="480"/>
    <line x1="800" y1="100" x2="800" y2="480"/>
  </g>
  <g font-size="12" fill="#a0a0a0" text-anchor="middle">
    <text x="300" y="498">0</text>
    <text x="425" y="498">10</text>
    <text x="550" y="498">20</text>
    <text x="675" y="498">30</text>
    <text x="800" y="498">40</text>
  </g>

  <!-- 기본 출장비 3~5 -->
  <text x="285" y="132" font-size="15" font-weight="600" fill="#444" text-anchor="end">기본 출장비 (평일 낮)</text>
  <rect x="337.5" y="115" width="25" height="24" rx="4" fill="#C26B4A"/>
  <text x="372" y="132" font-size="14" fill="#a8512f">3~5</text>

  <!-- 야간 출장비 5~7 -->
  <text x="285" y="182" font-size="15" font-weight="600" fill="#444" text-anchor="end">야간·주말 출장비</text>
  <rect x="362.5" y="165" width="25" height="24" rx="4" fill="#d9967d"/>
  <text x="397" y="182" font-size="14" fill="#a8512f">5~7</text>

  <!-- 콘센트 2개 교체 7 -->
  <text x="285" y="232" font-size="15" font-weight="600" fill="#444" text-anchor="end">콘센트 2개 교체</text>
  <rect x="300" y="215" width="87.5" height="24" rx="4" fill="#C26B4A"/>
  <text x="397" y="232" font-size="14" fill="#a8512f">7 (출장 5+작업 2)</text>

  <!-- 전등 2개 교체 7~15 -->
  <text x="285" y="282" font-size="15" font-weight="600" fill="#444" text-anchor="end">전등 2개 교체</text>
  <rect x="300" y="265" width="87.5" height="24" rx="4" fill="#C26B4A"/>
  <rect x="387.5" y="265" width="100" height="24" rx="4" fill="#efc8b8"/>
  <text x="497" y="282" font-size="14" fill="#a8512f">7~15 (등 포함 여부)</text>

  <!-- 누전차단기 교체 5~15 -->
  <text x="285" y="332" font-size="15" font-weight="600" fill="#444" text-anchor="end">누전차단기 교체</text>
  <rect x="362.5" y="315" width="125" height="24" rx="4" fill="#C26B4A"/>
  <text x="497" y="332" font-size="14" fill="#a8512f">5~15 (부품 포함)</text>

  <!-- 분전반 누전 점검·수리 10 -->
  <text x="285" y="382" font-size="15" font-weight="600" fill="#444" text-anchor="end">분전반 누전 점검·수리</text>
  <rect x="300" y="365" width="125" height="24" rx="4" fill="#C26B4A"/>
  <text x="435" y="382" font-size="14" fill="#a8512f">10</text>

  <!-- 누전 선로 보수·전선 교체 10~40 -->
  <text x="285" y="432" font-size="15" font-weight="600" fill="#444" text-anchor="end">누전 선로 보수·전선 교체</text>
  <rect x="425" y="415" width="375" height="24" rx="4" fill="#C26B4A"/>
  <text x="612" y="432" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">10~40 (2인·2시간 규모)</text>

  <text x="40" y="530" font-size="13" fill="#a0a0a0">※ 진한 색 = 출장비 포함 실제 청구 범위, 연한 색 = 자재 등급·시간대에 따라 추가되는 폭. 가정집 소액 작업은 대부분 1~1.5시간 안에 끝납니다.</text>
  <text x="40" y="548" font-size="13" fill="#a0a0a0">※ 새 위치 콘센트 증설·전용선 신설은 별도 범위(콘센트 증설 5~15/개소, 전용선 25~45) — 전기 공사 비용 글 참고.</text>
</svg>
