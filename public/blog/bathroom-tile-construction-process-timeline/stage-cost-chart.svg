<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="욕실 타일 시공 공정별 실제 비용 막대그래프">
  <rect width="800" height="510" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">욕실 타일 시공, 공정별 실제 비용</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">욕실 1칸(1~1.5평) 기준 · 실제 견적 사례 교차검증 (단위: 만원)</text>

  <!-- grid : x = 150 + 만원*2.2 -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="435"/>
    <line x1="260" y1="95" x2="260" y2="435"/>
    <line x1="370" y1="95" x2="370" y2="435"/>
    <line x1="480" y1="95" x2="480" y2="435"/>
    <line x1="590" y1="95" x2="590" y2="435"/>
    <line x1="700" y1="95" x2="700" y2="435"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="150" y="458">0</text>
    <text x="260" y="458">50만</text>
    <text x="370" y="458">100만</text>
    <text x="480" y="458">150만</text>
    <text x="590" y="458">200만</text>
    <text x="700" y="458">250만</text>
  </g>

  <!-- 1. 철거·폐기물 70~120 -->
  <text x="138" y="122" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">① 철거·폐기물 처리</text>
  <rect x="304" y="106" width="110" height="22" rx="11" fill="#c96f4a"/>
  <text x="420" y="122" font-size="13" fill="#6b6459">70만~120만</text>

  <!-- 2. 방수공사 40~80 -->
  <text x="138" y="180" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">② 방수 공사(미장+도막·양생)</text>
  <rect x="238" y="164" width="88" height="22" rx="11" fill="#c15f3c"/>
  <text x="332" y="180" font-size="13" fill="#6b6459">40만~80만</text>

  <!-- 3. 배관·전기 30~60 -->
  <text x="138" y="238" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">③ 배관·전기 설비(이설 시)</text>
  <rect x="216" y="222" width="66" height="22" rx="11" fill="#b56749"/>
  <text x="288" y="238" font-size="13" fill="#6b6459">30만~60만(옵션)</text>

  <!-- 4. 타일 시공 150~230 -->
  <text x="138" y="296" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">④ 타일 시공(자재+인건비)</text>
  <rect x="480" y="280" width="176" height="22" rx="11" fill="#a3624f"/>
  <text x="662" y="296" font-size="13" fill="#6b6459">150만~230만</text>

  <!-- 5. 도기 수전 120~180 -->
  <text x="138" y="354" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">⑤ 도기·수전 설치</text>
  <rect x="414" y="338" width="132" height="22" rx="11" fill="#8f5645"/>
  <text x="552" y="354" font-size="13" fill="#6b6459">120만~180만</text>

  <!-- 6. 천장 마감 30~55 -->
  <text x="138" y="412" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">⑥ 천장·조명 마감</text>
  <rect x="216" y="396" width="55" height="22" rx="11" fill="#7d5346"/>
  <text x="277" y="412" font-size="13" fill="#6b6459">30만~55만</text>

  <text x="40" y="480" font-size="12.5" fill="#8a8378">※ 여섯 공정 합치면 욕실 1칸 전체는 보통 400만~750만원 선. 등급·평형·이설 여부에 따라 벌어집니다.</text>
  <text x="40" y="497" font-size="12.5" fill="#8a8378">※ 실제 견적 빅데이터 교차검증 기준. 자재 등급(도기질·포세린)과 시공 범위(덧방·올철거)에 따라 항목별 폭이 달라질 수 있습니다.</text>
</svg>
