<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="800" height="560" fill="#FFFFFF"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#2B2622">맞춤 커튼 가격 vs 기성 커튼 가격 — 창 크기별 (창 1곳 기준)</text>
  <text x="30" y="70" font-size="13" fill="#8A8078">실제 판매가·견적 데이터 기준 · 단위: 만원 · 기성 = 온라인·마트 완제품, 온라인 맞춤 = 셀프 실측·셀프 설치, 업체 맞춤 = 방문 실측·시공 포함</text>

  <!-- legend -->
  <g font-size="12" fill="#4A423C">
    <rect x="30" y="86" width="14" height="14" rx="3" fill="#B8AEA4"/><text x="50" y="98">기성 커튼</text>
    <rect x="130" y="86" width="14" height="14" rx="3" fill="#E4A27F"/><text x="150" y="98">온라인 맞춤</text>
    <rect x="240" y="86" width="14" height="14" rx="3" fill="#C96F4A"/><text x="260" y="98">업체 맞춤(실측·시공)</text>
  </g>

  <!-- guide lines: x = 250 + 만원*9 -->
  <g stroke="#EFEAE4" stroke-width="1">
    <line x1="250" y1="112" x2="250" y2="480"/>
    <line x1="340" y1="112" x2="340" y2="480"/>
    <line x1="430" y1="112" x2="430" y2="480"/>
    <line x1="520" y1="112" x2="520" y2="480"/>
    <line x1="610" y1="112" x2="610" y2="480"/>
    <line x1="700" y1="112" x2="700" y2="480"/>
    <line x1="790" y1="112" x2="790" y2="480"/>
  </g>
  <g font-size="12" fill="#B0A69C" text-anchor="middle">
    <text x="250" y="500">0</text>
    <text x="340" y="500">10</text>
    <text x="430" y="500">20</text>
    <text x="520" y="500">30</text>
    <text x="610" y="500">40</text>
    <text x="700" y="500">50</text>
    <text x="790" y="500">60만원</text>
  </g>

  <!-- group 1: 작은방 창 -->
  <text x="30" y="132" font-size="14" font-weight="700" fill="#2B2622">작은방 창 · 가로 1.2~2m (1~2폭)</text>
  <g>
    <text x="238" y="154" font-size="12" fill="#6B625B" text-anchor="end">기성</text>
    <rect x="254" y="142" width="38" height="18" rx="4" fill="#B8AEA4"/>
    <text x="300" y="156" font-size="12" font-weight="700" fill="#2B2622">5천~4만 6천원 <tspan font-weight="400" fill="#8A8078">(장당 2만 900원 × 1~2장)</tspan></text>
  </g>
  <g>
    <text x="238" y="180" font-size="12" fill="#6B625B" text-anchor="end">온라인 맞춤</text>
    <rect x="267" y="168" width="37" height="18" rx="4" fill="#E4A27F"/>
    <text x="312" y="182" font-size="12" font-weight="700" fill="#2B2622">1만 9천~6만원</text>
  </g>
  <g>
    <text x="238" y="206" font-size="12" fill="#6B625B" text-anchor="end">업체 맞춤</text>
    <rect x="385" y="194" width="45" height="18" rx="4" fill="#C96F4A"/>
    <text x="438" y="208" font-size="12" font-weight="700" fill="#2B2622">15만~20만원</text>
  </g>

  <!-- group 2: 안방 창 -->
  <text x="30" y="248" font-size="14" font-weight="700" fill="#2B2622">안방 창 · 가로 2.5~3m (3폭)</text>
  <g>
    <text x="238" y="270" font-size="12" fill="#6B625B" text-anchor="end">기성</text>
    <rect x="288" y="258" width="115" height="18" rx="4" fill="#B8AEA4"/>
    <text x="411" y="272" font-size="12" font-weight="700" fill="#2B2622">4만 2천~17만원 <tspan font-weight="400" fill="#8A8078">(온라인 2~3장 → 마트 암막 380cm)</tspan></text>
  </g>
  <g>
    <text x="238" y="296" font-size="12" fill="#6B625B" text-anchor="end">온라인 맞춤</text>
    <rect x="307" y="284" width="65" height="18" rx="4" fill="#E4A27F"/>
    <text x="380" y="298" font-size="12" font-weight="700" fill="#2B2622">6만 3천~13만 5천원</text>
  </g>
  <g>
    <text x="238" y="322" font-size="12" fill="#6B625B" text-anchor="end">업체 맞춤</text>
    <rect x="385" y="310" width="90" height="18" rx="4" fill="#C96F4A"/>
    <text x="483" y="324" font-size="12" font-weight="700" fill="#2B2622">15만~25만원</text>
  </g>

  <!-- group 3: 거실 창 -->
  <text x="30" y="364" font-size="14" font-weight="700" fill="#2B2622">거실 창 · 가로 3.5~4.5m (4~5폭)</text>
  <g>
    <text x="238" y="386" font-size="12" fill="#6B625B" text-anchor="end">기성</text>
    <rect x="326" y="374" width="140" height="18" rx="4" fill="#B8AEA4"/>
    <text x="474" y="388" font-size="12" font-weight="700" fill="#2B2622">8만 5천~24만원 <tspan font-weight="400" fill="#8A8078">(마트 360cm 8만 4,900 → 암막 16만 9,900)</tspan></text>
  </g>
  <g>
    <text x="238" y="412" font-size="12" fill="#6B625B" text-anchor="end">온라인 맞춤</text>
    <rect x="385" y="400" width="216" height="18" rx="4" fill="#E4A27F"/>
    <text x="609" y="414" font-size="12" font-weight="700" fill="#2B2622">15만~39만원 <tspan font-weight="400" fill="#8A8078">(레일 별도)</tspan></text>
  </g>
  <g>
    <text x="238" y="438" font-size="12" fill="#6B625B" text-anchor="end">업체 맞춤</text>
    <rect x="610" y="426" width="180" height="18" rx="4" fill="#C96F4A"/>
    <text x="790" y="460" font-size="12" font-weight="700" fill="#2B2622" text-anchor="end">40만~60만원 · 가로 6m·층고 2.5m 넘는 대형창은 100만원+</text>
  </g>

  <text x="30" y="540" font-size="11" fill="#8A8078">* 기성은 세로 230·240cm 규격만 있어 커튼박스·층고가 맞아야 합니다. 업체 맞춤은 실측·설치·부자재 포함가, 온라인 맞춤은 레일·봉(1만 2천~4만원)과 설치 시간이 별도입니다.</text>
</svg>
