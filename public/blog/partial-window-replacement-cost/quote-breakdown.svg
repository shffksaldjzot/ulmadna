<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="330" fill="#fdfaf7"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#2d2a26">33평 아파트 부분 교체 견적서 — 517만원은 어떻게 쪼개지나</text>
  <text x="40" y="70" font-size="13" fill="#8a8378">거실·주방·방의 바깥쪽 창 6개소만 교체 · 총액 5,172,800원(부가세 별도)</text>

  <rect x="60" y="100" width="470" height="44" fill="#c96f4a"/>
  <rect x="530" y="100" width="190" height="44" fill="#b08968"/>
  <rect x="720" y="100" width="20" height="44" fill="#6b6459"/>

  <text x="295" y="128" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">창호 자재비 69%</text>
  <text x="625" y="128" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">시공·마감 28%</text>

  <g stroke="#c9bfb2" stroke-width="1">
    <line x1="295" y1="152" x2="295" y2="176"/>
    <line x1="625" y1="152" x2="625" y2="200"/>
    <line x1="730" y1="152" x2="730" y2="224"/>
  </g>

  <text x="295" y="196" font-size="14" font-weight="600" fill="#2d2a26" text-anchor="middle">창호 6개소 자재비 — 3,572,800원</text>
  <text x="295" y="216" font-size="12" fill="#8a8378" text-anchor="middle">창 하나당 35만~96만원 (크기·단창/이중창에 따라)</text>

  <text x="625" y="220" font-size="14" font-weight="600" fill="#2d2a26" text-anchor="middle">시공 + 외부코킹 + 내부폼충진</text>
  <text x="625" y="240" font-size="13" fill="#8a8378" text-anchor="middle">1,450,000원</text>

  <text x="740" y="244" font-size="13" font-weight="600" fill="#2d2a26" text-anchor="end">철거 + 폐기물 150,000원</text>

  <line x1="40" y1="268" x2="760" y2="268" stroke="#e8e2da" stroke-width="1"/>
  <text x="40" y="292" font-size="13" fill="#c96f4a" font-weight="700">같은 창을 1군 브랜드로 바꾸면 6,207,360원 — 창 6개소에서만 103만원(약 20%)이 벌어집니다.</text>
  <text x="40" y="313" font-size="12" fill="#8a8378">여기에 부가세 10%와 사다리차·크레인 양중비가 별도로 붙습니다.</text>
</svg>
