<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="520" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">TV 벽걸이 vs 스탠드 — 초기 설치비 + 이사 1회 이전비</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 견적 빅데이터 기준 · TV 본체 가격 제외 (단위: 만원)</text>

  <!-- legend -->
  <rect x="560" y="86" width="14" height="14" rx="3" fill="#c96f4a"/>
  <text x="580" y="98" font-size="12.5" fill="#6b6459">초기 설치비</text>
  <rect x="665" y="86" width="14" height="14" rx="3" fill="#d9b8a6"/>
  <text x="685" y="98" font-size="12.5" fill="#6b6459">이사 1회 이전비</text>

  <!-- grid: x = 190 + 만원*9 (0~60만) -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="190" y1="112" x2="190" y2="440"/>
    <line x1="280" y1="112" x2="280" y2="440"/>
    <line x1="370" y1="112" x2="370" y2="440"/>
    <line x1="460" y1="112" x2="460" y2="440"/>
    <line x1="550" y1="112" x2="550" y2="440"/>
    <line x1="640" y1="112" x2="640" y2="440"/>
    <line x1="730" y1="112" x2="730" y2="440"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="190" y="460">0</text>
    <text x="280" y="460">10만</text>
    <text x="370" y="460">20만</text>
    <text x="460" y="460">30만</text>
    <text x="550" y="460">40만</text>
    <text x="640" y="460">50만</text>
    <text x="730" y="460">60만</text>
  </g>

  <!-- 1. 스탠드(동봉 다리 + 기존 거실장) -->
  <text x="178" y="140" font-size="14.5" font-weight="600" fill="#2d2a26" text-anchor="end">스탠드(동봉 다리)</text>
  <text x="178" y="158" font-size="11.5" fill="#a09888" text-anchor="end">기존 거실장 위</text>
  <rect x="190" y="128" width="20" height="16" rx="8" fill="#c96f4a"/>
  <text x="218" y="141" font-size="12.5" fill="#6b6459">0~2만 (선 정리 셀프)</text>
  <rect x="190" y="150" width="8" height="16" rx="4" fill="#d9b8a6"/>
  <text x="206" y="163" font-size="12.5" fill="#6b6459">0 (일반 짐으로 운반)</text>

  <!-- 2. 별도 TV스탠드(이젤·원형) -->
  <text x="178" y="212" font-size="14.5" font-weight="600" fill="#2d2a26" text-anchor="end">별도 TV스탠드</text>
  <text x="178" y="230" font-size="11.5" fill="#a09888" text-anchor="end">이젤·원형 베이스형</text>
  <rect x="280" y="200" width="90" height="16" rx="8" fill="#c96f4a"/>
  <text x="378" y="213" font-size="12.5" fill="#6b6459">10만원대 (85인치 지원 제품 기준)</text>
  <rect x="190" y="222" width="8" height="16" rx="4" fill="#d9b8a6"/>
  <text x="206" y="235" font-size="12.5" fill="#6b6459">0 (분해·조립만)</text>

  <!-- 3. 타공 벽걸이 -->
  <text x="178" y="284" font-size="14.5" font-weight="600" fill="#2d2a26" text-anchor="end">타공 벽걸이</text>
  <text x="178" y="302" font-size="11.5" fill="#a09888" text-anchor="end">브라켓 포함 · 콘크리트 벽</text>
  <rect x="235" y="272" width="90" height="16" rx="8" fill="#c96f4a"/>
  <text x="333" y="285" font-size="12.5" fill="#6b6459">5만~15만</text>
  <rect x="235" y="294" width="193" height="16" rx="8" fill="#d9b8a6"/>
  <text x="436" y="307" font-size="12.5" fill="#6b6459">5만~26.5만 (평균 11만) + 새 집 재타공</text>

  <!-- 4. 무타공 벽걸이 -->
  <text x="178" y="356" font-size="14.5" font-weight="600" fill="#2d2a26" text-anchor="end">무타공 벽걸이</text>
  <text x="178" y="374" font-size="11.5" fill="#a09888" text-anchor="end">특수 브라켓 · 단자함 고정</text>
  <rect x="325" y="344" width="162" height="16" rx="8" fill="#c96f4a"/>
  <text x="495" y="357" font-size="12.5" fill="#6b6459">15만~33만 (+사전답사 4만)</text>
  <rect x="235" y="366" width="193" height="16" rx="8" fill="#d9b8a6"/>
  <text x="436" y="379" font-size="12.5" fill="#6b6459">5만~26.5만 · 자재는 가져감</text>

  <!-- 5. 85인치 대형 벽걸이 이전 -->
  <text x="178" y="418" font-size="14.5" font-weight="600" fill="#2d2a26" text-anchor="end">85인치 벽걸이 이전</text>
  <text x="178" y="436" font-size="11.5" fill="#a09888" text-anchor="end">제조사 이전설치 · 2인 작업</text>
  <rect x="550" y="414" width="99" height="16" rx="8" fill="#a3624f"/>
  <text x="657" y="427" font-size="12.5" fill="#6b6459">40만~51만</text>

  <text x="40" y="492" font-size="12.5" fill="#8a8378">※ 전월세 타공은 퇴거 때 타공자국 복원비(아트월은 수십만원대)가 별도로 붙습니다. 벽 재질·선 정리 범위에 따라 달라집니다.</text>
</svg>
