<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="470" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">주방 후드 교체 방식별 비용 범위</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 견적 빅데이터 기준 · 제품+공임 포함 (단위: 만원)</text>

  <!-- grid : x = 150 + 만원*6.75 -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="385"/>
    <line x1="285" y1="95" x2="285" y2="385"/>
    <line x1="420" y1="95" x2="420" y2="385"/>
    <line x1="555" y1="95" x2="555" y2="385"/>
    <line x1="690" y1="95" x2="690" y2="385"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="150" y="408">0</text>
    <text x="285" y="408">20만</text>
    <text x="420" y="408">40만</text>
    <text x="555" y="408">60만</text>
    <text x="690" y="408">80만</text>
  </g>

  <!-- 셀프 교체 5~15 -->
  <text x="138" y="122" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">셀프 교체(제품값만)</text>
  <rect x="184" y="106" width="68" height="22" rx="11" fill="#c96f4a"/>
  <text x="261" y="122" font-size="13" fill="#6b6459">5만~15만</text>

  <!-- 60cm 슬라이딩·매립형 업체 교체 10~15 -->
  <text x="138" y="180" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">60cm 슬라이딩·매립형 업체 교체</text>
  <rect x="218" y="164" width="34" height="22" rx="11" fill="#c96f4a"/>
  <text x="261" y="180" font-size="13" fill="#6b6459">10만~15만 (철거·폐기 포함)</text>

  <!-- 전동댐퍼 일체형 교체 16~23 -->
  <text x="138" y="238" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">전동댐퍼 일체형 교체</text>
  <rect x="258" y="222" width="47" height="22" rx="11" fill="#b56749"/>
  <text x="314" y="238" font-size="13" fill="#6b6459">16만~23만</text>

  <!-- 90cm 침니·박스형 교체 25~45 -->
  <text x="138" y="296" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">90cm 침니·박스형 교체</text>
  <rect x="319" y="280" width="135" height="22" rx="11" fill="#a3624f"/>
  <text x="463" y="296" font-size="13" fill="#6b6459">25만~45만</text>

  <!-- 프리미엄 제품+확산소화기 신설 50~80 -->
  <text x="138" y="354" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">프리미엄 제품+확산소화기 신설</text>
  <rect x="488" y="338" width="202" height="22" rx="11" fill="#7d5346"/>
  <text x="588" y="333" font-size="13" fill="#6b6459">50만~80만</text>

  <text x="40" y="446" font-size="12.5" fill="#8a8378">※ 같은 '후드 교체'인데 10만과 75만으로 갈립니다. 갈림길은 후드 타입·폭(60/90cm)·소화기·댐퍼 작업 여부입니다.</text>
</svg>
