<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="공간별 줄눈 시공 비용 비교 — 주방 벽면, 욕실, 현관, 베란다 (에폭시·케라폭시 기준)">
  <rect width="720" height="320" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">공간별 줄눈 시공 비용 비교 (에폭시·케라폭시 기준)</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 만원 · 실제 견적 빅데이터 기준 · 시공 면적·자재 등급에 따라 변동</text>

  <!-- gridlines -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="260" y1="84" x2="260" y2="256"/>
    <line x1="320" y1="84" x2="320" y2="256"/>
    <line x1="380" y1="84" x2="380" y2="256"/>
    <line x1="440" y1="84" x2="440" y2="256"/>
    <line x1="500" y1="84" x2="500" y2="256"/>
    <line x1="560" y1="84" x2="560" y2="256"/>
    <line x1="620" y1="84" x2="620" y2="256"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="200" y="274">0</text>
    <text x="260" y="274">10</text>
    <text x="320" y="274">20</text>
    <text x="380" y="274">30</text>
    <text x="440" y="274">40</text>
    <text x="500" y="274">50</text>
    <text x="560" y="274">60</text>
    <text x="620" y="274">70만원</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="188" y="112">주방 벽면(1평 내외)</text>
    <text x="188" y="156">욕실(2.5~3.5평)</text>
    <text x="188" y="200">현관(0.5~1평)</text>
    <text x="188" y="244">베란다(3~5평)</text>
  </g>

  <g>
    <!-- 주방 벽면 15~25 : x=200+15*6=290, w=10*6=60 -->
    <rect x="290" y="98" width="60" height="22" rx="4" fill="#c0653f"/>
    <text x="358" y="114" font-size="11" fill="#6b5d52">15~25</text>
    <!-- 욕실 30~55 : x=380, w=150 -->
    <rect x="380" y="142" width="150" height="22" rx="4" fill="#d98b6a"/>
    <text x="538" y="158" font-size="11" fill="#6b5d52">30~55</text>
    <!-- 현관 10~18 : x=260, w=48 -->
    <rect x="260" y="186" width="48" height="22" rx="4" fill="#cdbfb1"/>
    <text x="316" y="202" font-size="11" fill="#6b5d52">10~18</text>
    <!-- 베란다 35~60 : x=410, w=150 -->
    <rect x="410" y="230" width="150" height="22" rx="4" fill="#a84e2c"/>
    <text x="568" y="246" font-size="11" fill="#6b5d52">35~60</text>
  </g>

  <text x="24" y="292" font-size="12" fill="#8a8175">※ 면적이 작아도 출장·준비 같은 기본 비용이 고정으로 붙어 주방 벽면·현관처럼 좁은 공간은 평당 단가가 오히려 높게 느껴질 수 있습니다.</text>
  <text x="24" y="310" font-size="12" fill="#8a8175">※ 상부장 없는 오픈형 주방처럼 벽면 전체(2~3평)로 넓히면 총액도 그만큼 늘어납니다.</text>
</svg>
