<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="웃풍 잡는 방법별 비용 범위 — 셀프 틈막이·필름부터 84타입 샷시 전체 교체까지">
  <rect width="720" height="360" fill="#faf7f4"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#2b2b2b">웃풍 잡는 방법별 비용 범위 (84타입 기준)</text>
  <text x="24" y="60" font-size="13" fill="#8a8175">막대의 시작~끝 = 최소~최대 · 단위 만원 · 실제 견적 빅데이터 기준</text>

  <!-- axis: 0 at x=200, 1500 at x=690 -> 0.3267 px per 만원 -->
  <line x1="200" y1="88" x2="200" y2="316" stroke="#d9d0c7"/>
  <line x1="363" y1="88" x2="363" y2="316" stroke="#eee6dd"/>
  <line x1="527" y1="88" x2="527" y2="316" stroke="#eee6dd"/>
  <line x1="690" y1="88" x2="690" y2="316" stroke="#eee6dd"/>
  <text x="200" y="336" font-size="11" fill="#8a8175" text-anchor="middle">0</text>
  <text x="363" y="336" font-size="11" fill="#8a8175" text-anchor="middle">500만</text>
  <text x="527" y="336" font-size="11" fill="#8a8175" text-anchor="middle">1,000만</text>
  <text x="690" y="336" font-size="11" fill="#8a8175" text-anchor="middle">1,500만</text>

  <text x="24" y="118" font-size="13" font-weight="700" fill="#3d2f24">셀프 틈막이·에어캡</text>
  <rect x="200" y="102" width="6" height="26" rx="3" fill="#e8b399"/>
  <text x="216" y="120" font-size="12" fill="#6b5d52">1만~5만</text>

  <text x="24" y="168" font-size="13" font-weight="700" fill="#3d2f24">업체 필름 집 전체</text>
  <rect x="236" y="152" width="13" height="26" rx="3" fill="#d98b6a"/>
  <text x="260" y="170" font-size="12" fill="#6b5d52">110~150</text>

  <text x="24" y="218" font-size="13" font-weight="700" fill="#3d2f24">확장 거실 창호만</text>
  <rect x="243" y="202" width="72" height="26" rx="4" fill="#cf7a55"/>
  <text x="326" y="220" font-size="12" fill="#6b5d52">130~350</text>

  <text x="24" y="268" font-size="13" font-weight="700" fill="#3d2f24">외부창만 교체</text>
  <rect x="396" y="252" width="114" height="26" rx="4" fill="#b85f3b"/>
  <text x="520" y="270" font-size="12" fill="#6b5d52">600~950</text>

  <text x="24" y="308" font-size="13" font-weight="700" fill="#3d2f24">전체 교체</text>
  <rect x="510" y="292" width="180" height="22" rx="4" fill="#a84e2c"/>
  <text x="502" y="308" font-size="12" fill="#6b5d52" text-anchor="end">950~1,500</text>
</svg>
