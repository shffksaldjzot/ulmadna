<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="430" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">TV 벽걸이 후회, 다시 고치는 데 드는 돈</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 견적 빅데이터 기준 (단위: 만원)</text>

  <!-- grid: x = 150 + 만원*10 -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="345"/>
    <line x1="250" y1="95" x2="250" y2="345"/>
    <line x1="350" y1="95" x2="350" y2="345"/>
    <line x1="450" y1="95" x2="450" y2="345"/>
    <line x1="550" y1="95" x2="550" y2="345"/>
    <line x1="650" y1="95" x2="650" y2="345"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="150" y="368">0</text>
    <text x="250" y="368">10만</text>
    <text x="350" y="368">20만</text>
    <text x="450" y="368">30만</text>
    <text x="550" y="368">40만</text>
    <text x="650" y="368">50만</text>
  </g>

  <!-- 처음 타공 설치(참고) 5~15 -->
  <text x="138" y="122" font-size="15" font-weight="600" fill="#8a8378" text-anchor="end">처음 타공 설치(참고)</text>
  <rect x="200" y="106" width="100" height="22" rx="11" fill="#d8d0c5"/>
  <text x="310" y="122" font-size="13" fill="#6b6459">5만~15만</text>

  <!-- 높이 재시공(재타공) 6~10 -->
  <text x="138" y="182" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">높이 재시공(재타공)</text>
  <rect x="210" y="166" width="40" height="22" rx="11" fill="#c96f4a"/>
  <text x="260" y="182" font-size="13" fill="#6b6459">6만~10만 + 구멍 복구 별도</text>

  <!-- 무타공으로 전환 15~33 -->
  <text x="138" y="242" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">무타공으로 전환</text>
  <rect x="300" y="226" width="180" height="22" rx="11" fill="#a3624f"/>
  <text x="490" y="242" font-size="13" fill="#6b6459">15만~33만</text>

  <!-- 85인치 이전설치 40~51 -->
  <text x="138" y="302" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">85인치 이전설치</text>
  <rect x="550" y="286" width="110" height="22" rx="11" fill="#7d5346"/>
  <text x="550" y="326" font-size="13" fill="#6b6459">40만~51만 (철거+재설치+브라켓)</text>

  <text x="40" y="408" font-size="12.5" fill="#8a8378">※ 아트월(타일·대리석) 타공 복구는 별도로 수십만원대. 벽 재질·자재 구조에 따라 달라집니다.</text>
</svg>
