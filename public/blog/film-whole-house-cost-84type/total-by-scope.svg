<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="34평 필름 시공 비용 시공 범위별 총액 범위 막대그래프">
  <rect width="720" height="400" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">34평(84타입) 필름 시공 비용 — 범위별 총액</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 만원 · 자재+인건비 · 실제 34평 전후 사례 총액 기준, 현장 상태·필름 등급에 따라 변동</text>

  <!-- gridlines 0~600 (x: 200 + v*0.8) -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="200" y1="80" x2="200" y2="300"/>
    <line x1="280" y1="80" x2="280" y2="300"/>
    <line x1="360" y1="80" x2="360" y2="300"/>
    <line x1="440" y1="80" x2="440" y2="300"/>
    <line x1="520" y1="80" x2="520" y2="300"/>
    <line x1="600" y1="80" x2="600" y2="300"/>
    <line x1="680" y1="80" x2="680" y2="300"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="200" y="318">0</text>
    <text x="280" y="318">100</text>
    <text x="360" y="318">200</text>
    <text x="440" y="318">300</text>
    <text x="520" y="318">400</text>
    <text x="600" y="318">500</text>
    <text x="680" y="318">600</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="188" y="112">① 방문·문틀만</text>
    <text x="188" y="128" font-size="11" fill="#8a8175">5~6틀</text>
    <text x="188" y="182">② 표준 리폼</text>
    <text x="188" y="198" font-size="11" fill="#8a8175">문·문틀+현관+싱크대+가구</text>
    <text x="188" y="252">③ 집 전체 풀 통일</text>
    <text x="188" y="268" font-size="11" fill="#8a8175">②+샷시·몰딩·붙박이장·중문</text>
  </g>

  <!-- bars: x = 200 + 만원*0.8 -->
  <rect x="272" y="96" width="48" height="26" rx="6" fill="#d9a48f"/>
  <text x="328" y="114" font-size="12" fill="#3a3a3a">90만~150만</text>

  <rect x="360" y="166" width="160" height="26" rx="6" fill="#c9835f"/>
  <text x="528" y="184" font-size="12" fill="#3a3a3a">200만~400만</text>

  <rect x="520" y="236" width="160" height="26" rx="6" fill="#a8603e"/>
  <text x="528" y="230" font-size="12" fill="#3a3a3a">400만~600만</text>

  <!-- case dots -->
  <g fill="#2b2b2b">
    <circle cx="296" cy="179" r="4"/>
    <circle cx="336" cy="179" r="4"/>
    <circle cx="416" cy="179" r="4"/>
    <circle cx="496" cy="249" r="4"/>
    <circle cx="528" cy="249" r="4"/>
    <circle cx="548" cy="249" r="4"/>
    <circle cx="664" cy="249" r="4"/>
  </g>
  <g font-size="10" fill="#5a5148">
    <text x="284" y="209">120</text>
    <text x="326" y="209">170</text>
    <text x="406" y="209">270</text>
    <text x="486" y="285">370</text>
    <text x="520" y="285">410</text>
    <text x="548" y="285">435</text>
    <text x="654" y="285">580</text>
  </g>

  <g font-size="12" fill="#5a5148">
    <text x="24" y="350">● 검은 점 = 실제 30~34평 사례 총액(만원). ①은 방문 1틀 15만~25만원 × 5~6틀 계산값.</text>
    <text x="24" y="372">범위가 같아도 구축(퍼티·샌딩 면작업 多)·필름 등급·업체 단가에 따라 위아래로 움직여요.</text>
  </g>
</svg>
