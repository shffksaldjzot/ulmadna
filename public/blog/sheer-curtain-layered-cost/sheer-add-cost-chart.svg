<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="800" height="470" fill="#FFFFFF"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#2B2622">쉬어커튼(속커튼) 한 겹 추가 비용 — 구매 경로별 (거실 창 1곳 기준)</text>
  <text x="30" y="70" font-size="13" fill="#8A8078">실제 판매가·견적 데이터 기준 · 단위: 만원 · 거실 창 가로 3~4.5m · 레일 포함 여부는 각 행에 표기</text>

  <!-- guide lines: x = 250 + 만원*12 -->
  <g stroke="#EFEAE4" stroke-width="1">
    <line x1="250" y1="90" x2="250" y2="400"/>
    <line x1="310" y1="90" x2="310" y2="400"/>
    <line x1="370" y1="90" x2="370" y2="400"/>
    <line x1="430" y1="90" x2="430" y2="400"/>
    <line x1="490" y1="90" x2="490" y2="400"/>
    <line x1="550" y1="90" x2="550" y2="400"/>
    <line x1="610" y1="90" x2="610" y2="400"/>
    <line x1="670" y1="90" x2="670" y2="400"/>
    <line x1="730" y1="90" x2="730" y2="400"/>
    <line x1="790" y1="90" x2="790" y2="400"/>
  </g>
  <g font-size="12" fill="#B0A69C" text-anchor="middle">
    <text x="250" y="420">0</text>
    <text x="310" y="420">5</text>
    <text x="370" y="420">10</text>
    <text x="430" y="420">15</text>
    <text x="490" y="420">20</text>
    <text x="550" y="420">25</text>
    <text x="610" y="420">30</text>
    <text x="670" y="420">35</text>
    <text x="730" y="420">40</text>
    <text x="790" y="420">45만원</text>
  </g>

  <!-- row 1: 다이소 기성 -->
  <g>
    <text x="238" y="118" font-size="13" font-weight="700" fill="#2B2622" text-anchor="end">다이소 기성</text>
    <text x="238" y="134" font-size="11" fill="#8A8078" text-anchor="end">140×240cm 장당 5천원 × 2~3장</text>
    <rect x="262" y="112" width="6" height="18" rx="3" fill="#B8AEA4"/>
    <text x="276" y="126" font-size="12" font-weight="700" fill="#2B2622">1만~1만 5천원 <tspan font-weight="400" fill="#8A8078">(압축봉·봉 별도, 세로 길면 직접 재봉)</tspan></text>
  </g>

  <!-- row 2: 브랜드 기성 -->
  <g>
    <text x="238" y="176" font-size="13" font-weight="700" fill="#2B2622" text-anchor="end">브랜드 기성</text>
    <text x="238" y="192" font-size="11" fill="#8A8078" text-anchor="end">쉬어 1만 2,900원 ~ 린넨필 시어 나비주름 15만 9천원</text>
    <rect x="265" y="170" width="176" height="18" rx="4" fill="#B8AEA4"/>
    <text x="449" y="184" font-size="12" font-weight="700" fill="#2B2622">1만 3천~15만 9천원 <tspan font-weight="400" fill="#8A8078">(봉·레일 별도)</tspan></text>
  </g>

  <!-- row 3: 온라인 맞춤 -->
  <g>
    <text x="238" y="234" font-size="13" font-weight="700" fill="#2B2622" text-anchor="end">온라인 맞춤 + 셀프 설치</text>
    <text x="238" y="250" font-size="11" fill="#8A8078" text-anchor="end">4.5m 창 쉬폰 나비주름 2장 15만 6,500원 + 이중레일 1만 2천~4만원</text>
    <rect x="452" y="228" width="36" height="18" rx="4" fill="#E4A27F"/>
    <text x="496" y="242" font-size="12" font-weight="700" fill="#2B2622">17만~20만원 <tspan font-weight="400" fill="#8A8078">(레일 포함, 실측·타공은 직접)</tspan></text>
  </g>

  <!-- row 4: 업체 맞춤 시공 -->
  <g>
    <text x="238" y="292" font-size="13" font-weight="700" fill="#2B2622" text-anchor="end">업체 맞춤 시공</text>
    <text x="238" y="308" font-size="11" fill="#8A8078" text-anchor="end">국산 쉬폰 나비주름 · 방문 실측 · 이중레일 · 설치 포함</text>
    <rect x="490" y="286" width="60" height="18" rx="4" fill="#C96F4A"/>
    <text x="558" y="300" font-size="12" font-weight="700" fill="#2B2622">20만~25만원 <tspan font-weight="400" fill="#8A8078">(겉커튼 단독 → 이중 전환 시 추가분 15만~25만원)</tspan></text>
  </g>

  <!-- row 5: 수입 쉬어 / 대형창 -->
  <g>
    <text x="238" y="350" font-size="13" font-weight="700" fill="#2B2622" text-anchor="end">수입 쉬어 · 대형창 업체 시공</text>
    <text x="238" y="366" font-size="11" fill="#8A8078" text-anchor="end">가로 6m 이상 · 층고 2.5m 이상 · 터키·이탈리아 원단</text>
    <rect x="610" y="344" width="120" height="18" rx="4" fill="#A4532F"/>
    <text x="738" y="358" font-size="12" font-weight="700" fill="#2B2622">30만~40만원+</text>
  </g>

  <text x="30" y="452" font-size="12" fill="#8A8078">* 같은 거실 창인데 20배 차이가 나는 이유: 원단 양(나비주름 2~2.5배)·원단 등급(국산 폴리 → 수입)·실측 설치 인건비(약 10만원)·이중레일 포함 여부.</text>
</svg>
