<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" role="img" aria-label="무몰딩 시공 비용 — 방식별 추가 비용 범위 막대그래프. 몰딩 철거 보수 20~40만원, 도배형 무몰딩 30~60만원, 마이너스 몰딩 약 100만원, 목공형 무몰딩 200~500만원, 34평 84타입 기준">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#2b2b2b">무몰딩 시공 비용 — 방식별 추가 비용</text>
  <text x="40" y="74" font-size="15" fill="#8a8a8a">34평(84타입) 기준 · 일반 몰딩 시공 대비 '더 드는 금액' · 단위: 만원</text>

  <line x1="40" y1="430" x2="830" y2="430" stroke="#dddddd" stroke-width="2"/>

  <!-- 축 스케일: 500만원 = 320px (y=430 → y=110) -->
  <!-- 몰딩 철거+미장 보수 20~40 -->
  <rect x="90" y="404" width="110" height="13" rx="4" fill="#E0B4A3"/>
  <text x="145" y="394" font-size="16" fill="#a8512f" text-anchor="middle">+20~40</text>
  <text x="145" y="458" font-size="15" font-weight="600" fill="#444" text-anchor="middle">기존 몰딩 철거</text>
  <text x="145" y="478" font-size="13" fill="#888" text-anchor="middle">+ 미장 보수</text>

  <!-- 도배형 무몰딩 30~60 -->
  <rect x="270" y="392" width="110" height="19" rx="4" fill="#D89275"/>
  <text x="325" y="382" font-size="16" fill="#a8512f" text-anchor="middle">+30~60</text>
  <text x="325" y="458" font-size="15" font-weight="600" fill="#444" text-anchor="middle">도배형 무몰딩</text>
  <text x="325" y="478" font-size="13" fill="#888" text-anchor="middle">퍼티·코너비드·정밀재단</text>

  <!-- 마이너스 몰딩 약 100 -->
  <rect x="450" y="366" width="110" height="64" rx="4" fill="#C26B4A"/>
  <text x="505" y="356" font-size="16" fill="#a8512f" text-anchor="middle">약 100</text>
  <text x="505" y="458" font-size="15" font-weight="600" fill="#444" text-anchor="middle">마이너스 몰딩</text>
  <text x="505" y="478" font-size="13" fill="#888" text-anchor="middle">천장 목공 + 전용 몰딩</text>

  <!-- 목공형 무몰딩 200~500 -->
  <rect x="630" y="110" width="110" height="192" rx="4" fill="#A8512F"/>
  <text x="685" y="100" font-size="16" fill="#a8512f" text-anchor="middle">+200~500</text>
  <text x="685" y="458" font-size="15" font-weight="600" fill="#444" text-anchor="middle">목공형 무몰딩</text>
  <text x="685" y="478" font-size="13" fill="#888" text-anchor="middle">석고보드 2P 평탄화</text>

  <text x="40" y="508" font-size="12.5" fill="#999">* 도장(페인트) 마감으로 가면 별도 — 34평 전체 도장은 2,000만원 이상. 실제 견적 빅데이터 1,000건+ 및 시장 단가 기준.</text>
</svg>
