<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" role="img" aria-label="34평 84타입 기준 전기 배선 부분 보수와 전체 교체 비용 범위 비교 막대그래프">
  <rect width="860" height="380" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#2b2b2b">34평/84타입 — 부분 보수 vs 전체 교체 비용 범위</text>
  <text x="40" y="72" font-size="15" fill="#8a8a8a">단위: 만원 · 실제 견적 빅데이터 기준 · 부가세 별도 견적 포함</text>

  <!-- axis -->
  <line x1="230" y1="110" x2="230" y2="330" stroke="#dddddd" stroke-width="1.5"/>
  <line x1="230" y1="330" x2="820" y2="330" stroke="#dddddd" stroke-width="1.5"/>
  <text x="270" y="352" font-size="12" fill="#aaaaaa">0</text>
  <text x="410" y="352" font-size="12" fill="#aaaaaa">100</text>
  <text x="550" y="352" font-size="12" fill="#aaaaaa">200</text>
  <text x="690" y="352" font-size="12" fill="#aaaaaa">300</text>
  <text x="795" y="352" font-size="12" fill="#aaaaaa">400만원</text>

  <!-- 부분 보수 50~150 -->
  <text x="210" y="150" font-size="16" font-weight="600" fill="#444" text-anchor="end">부분 보수</text>
  <text x="210" y="169" font-size="12" fill="#999" text-anchor="end">기존 배선 유지</text>
  <rect x="336" y="138" width="131" height="30" rx="6" fill="#D9A28A"/>
  <text x="465" y="158" font-size="15" font-weight="700" fill="#a8512f" text-anchor="start">50~150만원</text>

  <!-- 전체 교체 표준 150~250 -->
  <text x="210" y="222" font-size="16" font-weight="600" fill="#444" text-anchor="end">전체 교체</text>
  <text x="210" y="241" font-size="12" fill="#999" text-anchor="end">노후 배선 전면 교체</text>
  <rect x="467" y="210" width="131" height="30" rx="6" fill="#C26B4A"/>
  <text x="608" y="230" font-size="15" font-weight="700" fill="#a8512f" text-anchor="start">150~250만원</text>

  <!-- 전체 교체 심화 250~390 -->
  <text x="210" y="294" font-size="16" font-weight="600" fill="#444" text-anchor="end">전체 교체</text>
  <text x="210" y="313" font-size="12" fill="#999" text-anchor="end">통콘크리트·조명 밀집</text>
  <rect x="598" y="282" width="184" height="30" rx="6" fill="#a8512f"/>
  <text x="792" y="302" font-size="15" font-weight="700" fill="#a8512f" text-anchor="start">250~390만원</text>

  <text x="40" y="372" font-size="13" fill="#a0a0a0">※ 부분 보수=콘센트 증설·인덕션 직결 등 필요 구간만. 전체 교체=배선 전면 교체+분전반+다회로. 통콘크리트·매립등 다수는 목공 병행으로 상단.</text>
</svg>
