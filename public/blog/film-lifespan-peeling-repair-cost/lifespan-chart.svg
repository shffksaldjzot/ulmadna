<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="필름 시공 수명 비교 — 저가 시트지 1~2년, 페인트 2~3년, 도배 4~6년, 밑작업 부실 필름 2~3년, 제대로 시공한 인테리어 필름 7~15년">
  <rect width="720" height="340" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">필름 시공 수명, 마감재별 비교</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 년 · 정상 사용환경 기준, 시공 품질·습기·직사광선에 따라 변동</text>

  <!-- gridlines 0~16 (x: 220 + n*28) -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="220" y1="80" x2="220" y2="270"/>
    <line x1="276" y1="80" x2="276" y2="270"/>
    <line x1="332" y1="80" x2="332" y2="270"/>
    <line x1="388" y1="80" x2="388" y2="270"/>
    <line x1="444" y1="80" x2="444" y2="270"/>
    <line x1="500" y1="80" x2="500" y2="270"/>
    <line x1="556" y1="80" x2="556" y2="270"/>
    <line x1="612" y1="80" x2="612" y2="270"/>
    <line x1="668" y1="80" x2="668" y2="270"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="220" y="288">0</text>
    <text x="276" y="288">2</text>
    <text x="332" y="288">4</text>
    <text x="388" y="288">6</text>
    <text x="444" y="288">8</text>
    <text x="500" y="288">10</text>
    <text x="556" y="288">12</text>
    <text x="612" y="288">14</text>
    <text x="668" y="288">16</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="208" y="105">저가 시트지(DIY)</text>
    <text x="208" y="141">페인트 리폼</text>
    <text x="208" y="177">도배(벽지)</text>
    <text x="208" y="213">필름 · 밑작업 부실</text>
    <text x="208" y="249" font-weight="700">필름 · 정상 시공</text>
  </g>

  <!-- bars: 1 year = 28px, start x=220 -->
  <g>
    <rect x="248" y="90" width="28" height="22" rx="4" fill="#d9cfc4"/>
    <rect x="276" y="126" width="28" height="22" rx="4" fill="#d9cfc4"/>
    <rect x="332" y="162" width="56" height="22" rx="4" fill="#d9cfc4"/>
    <rect x="276" y="198" width="28" height="22" rx="4" fill="#e0a08a"/>
    <rect x="416" y="234" width="224" height="22" rx="4" fill="#c1634a"/>
  </g>

  <!-- value labels -->
  <g font-size="12" fill="#5a534c">
    <text x="284" y="105">1~2년</text>
    <text x="312" y="141">2~3년</text>
    <text x="396" y="177">4~6년</text>
    <text x="312" y="213" fill="#b5452c">2~3년 만에 모서리 들뜸</text>
    <text x="648" y="249" font-weight="700" fill="#2b2b2b">7~15년</text>
  </g>

  <text x="24" y="322" font-size="12" fill="#8a8175">※ 같은 필름이라도 탈지·퍼티·프라이머(밑작업)를 건너뛰면 수명이 1/3 이하로 줄어듭니다.</text>
</svg>
