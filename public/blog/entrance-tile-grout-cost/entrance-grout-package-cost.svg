<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="34평/84타입 줄눈 시공 구성별 비용 — 욕실 1곳 10만~20만, 욕실 2곳 20만~40만, 욕실 2곳+현관 30만~50만, 세탁실 추가 35만~60만, 베란다 추가 40만~70만, 프리미엄 에폭시 60만~100만 이상">
  <rect width="760" height="380" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">현관을 넣으면 얼마 더 붙을까 — 34평/84타입 줄눈 구성별 비용</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 만원 · 실제 견적 빅데이터 기준 · 막대 = 최저~최고 견적 범위</text>

  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="210" y1="80" x2="210" y2="312"/>
    <line x1="310" y1="80" x2="310" y2="312"/>
    <line x1="410" y1="80" x2="410" y2="312"/>
    <line x1="510" y1="80" x2="510" y2="312"/>
    <line x1="610" y1="80" x2="610" y2="312"/>
    <line x1="710" y1="80" x2="710" y2="312"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="210" y="330">0</text>
    <text x="310" y="330">20</text>
    <text x="410" y="330">40</text>
    <text x="510" y="330">60</text>
    <text x="610" y="330">80</text>
    <text x="710" y="330">100만원</text>
  </g>

  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="198" y="105">욕실 1곳 바닥</text>
    <text x="198" y="148">욕실 2곳 바닥</text>
    <text x="198" y="191" font-weight="700" fill="#a84e2c">욕실 2곳 + 현관</text>
    <text x="198" y="234">+ 세탁실</text>
    <text x="198" y="277">+ 베란다</text>
  </g>

  <g>
    <!-- 5px per 만원, x0=210 -->
    <rect x="260" y="88" width="50" height="22" rx="4" fill="#cdbfb1"/>
    <text x="318" y="104" font-size="11" fill="#6b5d52">10~20</text>
    <rect x="310" y="131" width="100" height="22" rx="4" fill="#cdbfb1"/>
    <text x="418" y="147" font-size="11" fill="#6b5d52">20~40</text>
    <rect x="360" y="174" width="100" height="22" rx="4" fill="#c0653f"/>
    <text x="468" y="190" font-size="11" font-weight="700" fill="#6b5d52">30~50</text>
    <rect x="385" y="217" width="125" height="22" rx="4" fill="#d98b6a"/>
    <text x="518" y="233" font-size="11" fill="#6b5d52">35~60</text>
    <rect x="410" y="260" width="150" height="22" rx="4" fill="#d98b6a"/>
    <text x="568" y="276" font-size="11" fill="#6b5d52">40~70</text>
  </g>

  <text x="24" y="352" font-size="12" fill="#8a8175">※ 욕실 2곳만 할 때(20~40)와 현관을 넣었을 때(30~50)를 비교하면 현관 추가분은 대략 10만원 안팎입니다.</text>
  <text x="24" y="370" font-size="12" fill="#8a8175">※ 프리미엄 에폭시 전 구성은 60만~100만원 이상, 벽면·다공간 확대 시 100만원 이상까지 올라갑니다.</text>
</svg>
