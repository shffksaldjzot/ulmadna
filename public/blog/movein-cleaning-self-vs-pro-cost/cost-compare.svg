<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="입주청소 직접 하기 vs 업체 34평 84타입 비용 비교 차트">
<rect width="640" height="330" fill="#faf7f2"/>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#3a2e28">34평(84타입) 입주청소 — 직접 하기 vs 업체 (만원)</text>
<g font-family="sans-serif" font-size="13" fill="#3a2e28">
<text x="20" y="85">직접 하기(도구비)</text>
<rect x="170" y="65" width="42" height="26" fill="#9bb59a" rx="3"/><rect x="170" y="65" width="140" height="26" fill="none"/>
<text x="320" y="84" font-weight="700">3만~10만 + 약 16인시</text>
<text x="20" y="145">업체 정찰 기준</text>
<rect x="170" y="125" width="224" height="26" fill="#d9a38a" rx="3"/>
<text x="404" y="144" font-weight="700">약 37만</text>
<text x="20" y="205">업체 40~51만대</text>
<rect x="170" y="185" width="306" height="26" fill="#c9795a" rx="3"/>
<text x="486" y="204" font-weight="700">40만~51만</text>
<text x="20" y="265">분진 추가·고가 단가</text>
<rect x="170" y="245" width="408" height="26" fill="#a85a3c" rx="3"/>
<text x="400" y="264" font-weight="700" fill="#fff">약 48만~68만</text>
</g>
<text x="320" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a6b62">막대 길이는 대략적 비율 · 실제 견적 데이터 기준</text>
</svg>
