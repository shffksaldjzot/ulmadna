<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="440" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">인테리어 필름 자재 등급별 m²당 단가</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 견적 빅데이터 기준 · 자재 단가 (단위: 만원/m²)</text>

  <!-- grid : x = 190 + 만원*100 -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="190" y1="95" x2="190" y2="330"/>
    <line x1="290" y1="95" x2="290" y2="330"/>
    <line x1="390" y1="95" x2="390" y2="330"/>
    <line x1="490" y1="95" x2="490" y2="330"/>
    <line x1="590" y1="95" x2="590" y2="330"/>
    <line x1="690" y1="95" x2="690" y2="330"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="190" y="352">0</text>
    <text x="290" y="352">1만</text>
    <text x="390" y="352">2만</text>
    <text x="490" y="352">3만</text>
    <text x="590" y="352">4만</text>
    <text x="690" y="352">5만</text>
  </g>

  <!-- 시트지(참고) : 기본 필름의 1/3~1/2 -->
  <text x="178" y="130" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">시트지 (임시용·참고)</text>
  <rect x="223" y="114" width="67" height="22" rx="11" fill="none" stroke="#c9b8a6" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="300" y="130" font-size="13" fill="#6b6459">기본 필름의 1/3~1/2 · 내구성 1~3년</text>

  <!-- 국산 브랜드 기본 라인 1~2만 -->
  <text x="178" y="196" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">국산 브랜드 기본 라인</text>
  <rect x="290" y="180" width="100" height="22" rx="11" fill="#c96f4a"/>
  <text x="400" y="196" font-size="13" fill="#6b6459">1만~2만원 · 대부분의 집은 이걸로 충분</text>

  <!-- 프리미엄 라인·고급 패턴 3~5만+ -->
  <text x="178" y="262" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">프리미엄 라인·고급 패턴</text>
  <rect x="490" y="246" width="200" height="22" rx="11" fill="#a3624f"/>
  <text x="588" y="240" font-size="13" fill="#6b6459">3만~5만원 이상</text>

  <!-- 수입 브랜드 annotation -->
  <text x="178" y="316" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">수입 (3M 다이낙·레놀릿)</text>
  <text x="200" y="316" font-size="13" fill="#7d5346" font-weight="600">프리미엄보다 더 위 — 소재·물류비가 얹혀 국산 대비 부담이 큽니다 →</text>

  <text x="40" y="392" font-size="12.5" fill="#8a8378">※ 같은 브랜드 안에서도 솔리드(단색)·우드·패브릭 등 시리즈에 따라 단가가 갈립니다.</text>
  <text x="40" y="414" font-size="12.5" fill="#8a8378">※ 총 견적에서 자재비는 30~40%뿐 — 나머지는 인건비라서, 자재 등급을 올려도 총액은 생각보다 덜 오릅니다.</text>
</svg>
