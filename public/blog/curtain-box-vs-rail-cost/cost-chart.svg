<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="800" height="560" fill="#FFFFFF"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#2B2622">커튼박스 vs 커튼레일 vs 봉 — 거실 창 1개(4~5m) 기준 비용</text>
  <text x="30" y="70" font-size="13" fill="#8A8078">실제 견적 데이터 · 커튼 원단 제외 · 단위: 만원</text>

  <!-- guide lines: x = 250 + 만원*11.5 -->
  <g stroke="#EFEAE4" stroke-width="1">
    <line x1="250" y1="95" x2="250" y2="490"/>
    <line x1="365" y1="95" x2="365" y2="490"/>
    <line x1="480" y1="95" x2="480" y2="490"/>
    <line x1="595" y1="95" x2="595" y2="490"/>
    <line x1="710" y1="95" x2="710" y2="490"/>
  </g>
  <g font-size="12" fill="#B0A69C" text-anchor="middle">
    <text x="250" y="510">0</text>
    <text x="365" y="510">10</text>
    <text x="480" y="510">20</text>
    <text x="595" y="510">30</text>
    <text x="710" y="510">40만원</text>
  </g>

  <!-- 1. 커튼레일 노출 셀프 1~2 -->
  <g>
    <text x="238" y="122" font-size="14" fill="#4A423C" text-anchor="end">커튼레일 노출 · 셀프</text>
    <rect x="261" y="106" width="12" height="24" rx="3" fill="#C96F4A"/>
    <text x="283" y="123" font-size="13" font-weight="700" fill="#C96F4A">1만~2만 (레일값만)</text>
  </g>
  <!-- 2. 커튼봉 노출 셀프 1~3 -->
  <g>
    <text x="238" y="170" font-size="14" fill="#4A423C" text-anchor="end">커튼봉 노출 · 셀프</text>
    <rect x="261" y="154" width="24" height="24" rx="3" fill="#C96F4A"/>
    <text x="295" y="171" font-size="13" font-weight="700" fill="#C96F4A">1만~3만 (조절봉+배송)</text>
  </g>
  <!-- 3. 봉·레일 기사 설치 6~9 -->
  <g>
    <text x="238" y="218" font-size="14" fill="#4A423C" text-anchor="end">봉·레일 노출 · 기사 설치</text>
    <rect x="319" y="202" width="35" height="24" rx="3" fill="#D9895F"/>
    <text x="364" y="219" font-size="13" font-weight="700" fill="#C96F4A">6만~9만 (출장 포함)</text>
  </g>
  <!-- 4. 커튼박스 목공 중 추가 5.5~ -->
  <g>
    <text x="238" y="266" font-size="14" fill="#4A423C" text-anchor="end">커튼박스 · 목공 공정 중 추가</text>
    <rect x="313" y="250" width="10" height="24" rx="3" fill="#7A6A5C"/>
    <text x="333" y="267" font-size="13" font-weight="700" fill="#5E5048">인건비 약 5.5만 (m당 1.1만) + 자재</text>
  </g>
  <!-- 5. 커튼박스 단독 호출 25~35 -->
  <g>
    <text x="238" y="314" font-size="14" fill="#4A423C" text-anchor="end">커튼박스 · 목수 단독 호출(1품)</text>
    <rect x="537" y="298" width="115" height="24" rx="3" fill="#7A6A5C"/>
    <text x="662" y="315" font-size="13" font-weight="700" fill="#5E5048">25만~35만</text>
  </g>
  <!-- 6. + 간접조명 업체 7~23 -->
  <g>
    <text x="238" y="362" font-size="14" fill="#4A423C" text-anchor="end">+ 박스 간접조명 (업체)</text>
    <rect x="330" y="346" width="184" height="24" rx="3" fill="#B8A48F"/>
    <text x="524" y="363" font-size="13" font-weight="700" fill="#7A6A5C">7만~23만 (셀프 2만~3만)</text>
  </g>
  <!-- 7. + 전동 전원 6~15 -->
  <g>
    <text x="238" y="410" font-size="14" fill="#4A423C" text-anchor="end">+ 전동커튼 전원 작업</text>
    <rect x="319" y="394" width="103" height="24" rx="3" fill="#B8A48F"/>
    <text x="432" y="411" font-size="13" font-weight="700" fill="#7A6A5C">6만~15만</text>
  </g>
  <!-- 8. 전동커튼 세트+설치 34~41 -->
  <g>
    <text x="238" y="458" font-size="14" fill="#4A423C" text-anchor="end">전동커튼 레일세트 + 방문설치</text>
    <rect x="641" y="442" width="80" height="24" rx="3" fill="#8F7B6A"/>
    <text x="640" y="484" font-size="12" font-weight="700" fill="#7A6A5C" text-anchor="middle">34만~41만</text>
  </g>

  <text x="30" y="545" font-size="12" fill="#B0A69C">커튼박스 인건비는 2026 표준 품셈(m당 약 11,179원) 기준 · 단독 호출은 목수 1품(하루) 단가 · 자재비 별도</text>
</svg>
