<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="430" fill="#fdfaf7"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#2d2a26">욕조 철거 후 선택지별 총비용</text>
  <text x="40" y="72" font-size="13" fill="#8a8378">실제 견적 빅데이터 기준 · 철거+방수+타일 마감 포함 (단위: 만원)</text>

  <!-- grid -->
  <g stroke="#e8e2da" stroke-width="1">
    <line x1="150" y1="95" x2="150" y2="345"/>
    <line x1="260" y1="95" x2="260" y2="345"/>
    <line x1="369" y1="95" x2="369" y2="345"/>
    <line x1="479" y1="95" x2="479" y2="345"/>
    <line x1="588" y1="95" x2="588" y2="345"/>
    <line x1="698" y1="95" x2="698" y2="345"/>
  </g>
  <g font-size="12" fill="#a09888" text-anchor="middle">
    <text x="150" y="368">0</text>
    <text x="260" y="368">100만</text>
    <text x="369" y="368">200만</text>
    <text x="479" y="368">300만</text>
    <text x="588" y="368">400만</text>
    <text x="698" y="368">500만</text>
  </g>

  <!-- bars: x = 150 + 만원*1.096 -->
  <!-- 오픈 샤워 100~150 -->
  <text x="138" y="122" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">오픈 샤워(철거+마감만)</text>
  <rect x="260" y="106" width="55" height="22" rx="11" fill="#c96f4a"/>
  <text x="324" y="122" font-size="13" fill="#6b6459">100만~150만</text>

  <!-- 유리 파티션 110~190 -->
  <text x="138" y="182" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">+ 유리 파티션</text>
  <rect x="271" y="166" width="88" height="22" rx="11" fill="#c96f4a"/>
  <text x="368" y="182" font-size="13" fill="#6b6459">110만~190만</text>

  <!-- 샤워부스 140~240 -->
  <text x="138" y="242" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">+ 샤워부스(도어형)</text>
  <rect x="303" y="226" width="110" height="22" rx="11" fill="#a3624f"/>
  <text x="422" y="242" font-size="13" fill="#6b6459">140만~240만</text>

  <!-- 조적 파티션 300~500 -->
  <text x="138" y="302" font-size="15" font-weight="600" fill="#2d2a26" text-anchor="end">+ 조적 파티션(리모델링 동반)</text>
  <rect x="479" y="286" width="219" height="22" rx="11" fill="#7d5346"/>
  <text x="479" y="326" font-size="13" fill="#6b6459">300만~500만대</text>

  <text x="40" y="408" font-size="12.5" fill="#8a8378">※ 욕조 철거만 단독 진행하면 15만~25만원. 조적 파티션은 욕실 전체 리모델링과 함께 진행하는 경우가 많습니다.</text>
</svg>
