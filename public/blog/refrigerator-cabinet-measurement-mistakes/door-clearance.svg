<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="냉장고장 문 안 열림 평면도 — 벽 쪽 여유 공간이 부족하면 문이 90도에서 멈추고 서랍이 안 나온다">
  <rect width="720" height="380" fill="#faf7f2"/>
  <text x="360" y="30" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3b2f27">위에서 본 냉장고 문 열림 — 벽 쪽 여유가 결과를 가른다</text>

  <!-- left: 여유 부족 -->
  <g transform="translate(20,60)">
    <text x="160" y="12" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#b4472f">실패: 벽 쪽 여유 0~10mm</text>
    <rect x="0" y="30" width="22" height="230" fill="#d9d2c7"/>
    <text x="11" y="280" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b5e53">벽</text>
    <rect x="22" y="150" width="190" height="110" fill="#fff" stroke="#6b5e53" stroke-width="2"/>
    <text x="117" y="212" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#3b2f27">냉장고 본체</text>
    <!-- door stopped at 90 -->
    <line x1="22" y1="150" x2="22" y2="60" stroke="#b4472f" stroke-width="6"/>
    <path d="M 22 150 A 90 90 0 0 1 22 60" fill="none" stroke="#b4472f" stroke-dasharray="4 4"/>
    <text x="120" y="100" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#b4472f">문 90°에서 벽에 걸림</text>
    <text x="120" y="120" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#b4472f">서랍·선반이 안 빠짐</text>
  </g>

  <!-- right: 여유 확보 -->
  <g transform="translate(380,60)">
    <text x="160" y="12" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#2f6b4a">성공: 벽 쪽 30~50mm 확보</text>
    <rect x="0" y="30" width="22" height="230" fill="#d9d2c7"/>
    <text x="11" y="280" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b5e53">벽</text>
    <rect x="50" y="150" width="190" height="110" fill="#fff" stroke="#6b5e53" stroke-width="2"/>
    <text x="145" y="212" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#3b2f27">냉장고 본체</text>
    <rect x="22" y="150" width="28" height="110" fill="#e6efe9" stroke="#2f6b4a" stroke-dasharray="4 3"/>
    <text x="36" y="280" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2f6b4a">여유</text>
    <!-- door at ~115 -->
    <line x1="50" y1="150" x2="22" y2="66" stroke="#2f6b4a" stroke-width="6"/>
    <path d="M 50 150 A 88 88 0 0 1 22 66" fill="none" stroke="#2f6b4a" stroke-dasharray="4 4"/>
    <text x="160" y="100" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#2f6b4a">문 115° 이상 열림</text>
    <text x="160" y="120" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#2f6b4a">서랍·선반이 끝까지 빠짐</text>
  </g>
  <text x="360" y="365" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#6b5e53">※ 개념 도식입니다. 실제 여유는 구매할 모델의 제조사 설치도면 기준으로 확정하세요.</text>
</svg>
