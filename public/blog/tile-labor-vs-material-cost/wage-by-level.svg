<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="경력별 타일공 일당 막대그래프">
  <rect width="720" height="320" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">경력별 타일공 일당</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 만원 · 실제 견적·현장 데이터 기준, 지역·시즌에 따라 변동</text>

  <!-- gridlines -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="160" y1="80" x2="160" y2="270"/>
    <line x1="243" y1="80" x2="243" y2="270"/>
    <line x1="326" y1="80" x2="326" y2="270"/>
    <line x1="409" y1="80" x2="409" y2="270"/>
    <line x1="492" y1="80" x2="492" y2="270"/>
    <line x1="575" y1="80" x2="575" y2="270"/>
    <line x1="660" y1="80" x2="660" y2="270"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="160" y="288">0</text>
    <text x="243" y="288">10</text>
    <text x="326" y="288">20</text>
    <text x="409" y="288">30</text>
    <text x="492" y="288">40</text>
    <text x="575" y="288">50</text>
    <text x="660" y="288">60만원</text>
  </g>

  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="148" y="105">조공(초보)</text>
    <text x="148" y="150">준기공</text>
    <text x="148" y="195">기공(정기술자)</text>
    <text x="148" y="240">오야(팀장)</text>
  </g>

  <g>
    <!-- 조공 12~18 -->
    <rect x="260" y="92" width="50" height="20" rx="4" fill="#e2a688"/>
    <text x="316" y="107" font-size="11" fill="#6b5d52">12만~18만원</text>
    <!-- 준기공 18~30 -->
    <rect x="310" y="137" width="100" height="20" rx="4" fill="#d98b6a"/>
    <text x="416" y="152" font-size="11" fill="#6b5d52">18만~30만원</text>
    <!-- 기공 25~35 -->
    <rect x="368" y="182" width="83" height="20" rx="4" fill="#c0653f"/>
    <text x="457" y="197" font-size="11" fill="#6b5d52">25만~35만원</text>
    <!-- 오야 40+ -->
    <rect x="493" y="227" width="167" height="20" rx="4" fill="#a84e2c"/>
    <text x="576" y="242" font-size="11" fill="#fbeee7" text-anchor="middle">40만원 이상</text>
  </g>

  <text x="24" y="308" font-size="12" fill="#8a8175">※ 대한건설협회 2026년 상반기 공식 노임단가는 타일공 평균 약 29만원(조공~기공 통계 평균)이에요.</text>
</svg>
