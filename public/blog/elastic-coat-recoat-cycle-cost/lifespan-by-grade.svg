<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="탄성코트 자재 등급별 수명 비교 막대그래프 — 일반 아크릴계 3~5년, 바이오세라믹 중급형 5~8년, 우레탄·실리콘 프리미엄 8~15년">
  <rect width="720" height="320" fill="#faf7f4"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#2b2b2b">자재 등급별 탄성코트 수명</text>
  <text x="24" y="62" font-size="13" fill="#8a8175">단위: 년 · 표준 시공·표준 관리 기준 · 벽 상태·환경에 따라 변동</text>

  <!-- gridlines -->
  <g stroke="#e7ddd3" stroke-width="1">
    <line x1="200" y1="84" x2="200" y2="240"/>
    <line x1="284" y1="84" x2="284" y2="240"/>
    <line x1="369" y1="84" x2="369" y2="240"/>
    <line x1="453" y1="84" x2="453" y2="240"/>
    <line x1="538" y1="84" x2="538" y2="240"/>
    <line x1="622" y1="84" x2="622" y2="240"/>
  </g>
  <g font-size="11" fill="#a89e92" text-anchor="middle">
    <text x="200" y="258">0년</text>
    <text x="284" y="258">3년</text>
    <text x="369" y="258">6년</text>
    <text x="453" y="258">9년</text>
    <text x="538" y="258">12년</text>
    <text x="622" y="258">15년</text>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#3a3a3a" text-anchor="end">
    <text x="188" y="112">일반 아크릴계</text>
    <text x="188" y="126" font-size="10" fill="#a89e92">저가형·단기 임시용</text>
    <text x="188" y="170">바이오세라믹</text>
    <text x="188" y="184" font-size="10" fill="#a89e92">중급형·가장 대중적</text>
    <text x="188" y="228">우레탄·실리콘</text>
    <text x="188" y="242" font-size="10" fill="#a89e92">프리미엄·단열 강화형</text>
  </g>

  <g>
    <!-- 일반 아크릴계 3~5년 -->
    <rect x="284" y="98" width="56" height="24" rx="4" fill="#e0a98e"/>
    <text x="348" y="115" font-size="11" fill="#6b5d52">3~5년</text>
    <!-- 바이오세라믹 5~8년 -->
    <rect x="341" y="156" width="84" height="24" rx="4" fill="#d98b6a"/>
    <text x="433" y="173" font-size="11" fill="#6b5d52">5~8년</text>
    <!-- 우레탄·실리콘 8~15년 -->
    <rect x="425" y="214" width="197" height="24" rx="4" fill="#a84e2c"/>
    <text x="630" y="231" font-size="11" fill="#6b5d52">8~15년</text>
  </g>

  <text x="24" y="278" font-size="12" fill="#8a8175">※ 제조사 공인 내구연한은 보통 7~8년. 3년 보증은 하자 A/S 기간이지 수명 자체가 아닙니다.</text>
  <text x="24" y="298" font-size="12" fill="#8a8175">※ 결로·누수가 반복되거나 밑작업 없이 덧칠하면 등급과 무관하게 수명이 크게 줄어듭니다.</text>
</svg>
