<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" role="img" aria-label="분전반 교체 비용 4단계 가격 범위 차트 — 분기 차단기 교체 5~15만원, 내부 전체 교체 15~30만원, 전용회로 신설 회로당 25~45만원, 함체 통째 교체 30~100만원, 누전 선로 보수 10~30만원, 출장 점검비 3~10만원">
  <rect width="860" height="600" fill="#ffffff"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#2b2b2b">분전반 교체 비용 — 공사 범위별 실제 가격 범위</text>
  <text x="40" y="74" font-size="15" fill="#8a8a8a">가정용 단상 기준 · 출장비·부품 포함 실제 청구 범위 · 단위: 만원</text>

  <!-- grid: x scale 0~100만원 → x=300 + v*5 -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="300" y1="100" x2="300" y2="520"/>
    <line x1="400" y1="100" x2="400" y2="520"/>
    <line x1="500" y1="100" x2="500" y2="520"/>
    <line x1="600" y1="100" x2="600" y2="520"/>
    <line x1="700" y1="100" x2="700" y2="520"/>
    <line x1="800" y1="100" x2="800" y2="520"/>
  </g>
  <g font-size="12" fill="#a0a0a0" text-anchor="middle">
    <text x="300" y="538">0</text>
    <text x="400" y="538">20</text>
    <text x="500" y="538">40</text>
    <text x="600" y="538">60</text>
    <text x="700" y="538">80</text>
    <text x="800" y="538">100</text>
  </g>

  <!-- 1단계 분기 차단기 1~2개 교체 5~15 -->
  <text x="285" y="132" font-size="15" font-weight="600" fill="#444" text-anchor="end">① 분기 차단기 1~2개 교체</text>
  <rect x="325" y="115" width="50" height="24" rx="4" fill="#C26B4A"/>
  <text x="385" y="132" font-size="14" fill="#a8512f">5~15</text>

  <!-- 2단계 내부 전체(메인+분기) 교체 15~30 -->
  <text x="285" y="192" font-size="15" font-weight="600" fill="#444" text-anchor="end">② 내부 전체 교체 (메인+분기, 함 유지)</text>
  <rect x="375" y="175" width="75" height="24" rx="4" fill="#C26B4A"/>
  <text x="460" y="192" font-size="14" fill="#a8512f">15~30</text>

  <!-- 3단계 전용회로 신설 회로당 25~45 -->
  <text x="285" y="252" font-size="15" font-weight="600" fill="#444" text-anchor="end">③ 전용회로 신설 (회로당, ②에 추가)</text>
  <rect x="425" y="235" width="100" height="24" rx="4" fill="#d9967d"/>
  <text x="535" y="252" font-size="14" fill="#a8512f">+25~45 / 회로</text>

  <!-- 4단계 함체까지 통째 교체 30~100 -->
  <text x="285" y="312" font-size="15" font-weight="600" fill="#444" text-anchor="end">④ 함체까지 통째 교체 (매립·까대기·마감)</text>
  <rect x="450" y="295" width="350" height="24" rx="4" fill="#C26B4A"/>
  <text x="620" y="312" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">30~100</text>

  <!-- 부가: 누전 선로 보수·재입선 10~30 -->
  <text x="285" y="392" font-size="15" font-weight="600" fill="#444" text-anchor="end">＋ 누전 선로 보수·재입선</text>
  <rect x="350" y="375" width="100" height="24" rx="4" fill="#efc8b8"/>
  <text x="460" y="392" font-size="14" fill="#a8512f">10~30 (구간당 20 이상 추가)</text>

  <!-- 부가: 출장 점검비 3~10, 야간 15~20 -->
  <text x="285" y="452" font-size="15" font-weight="600" fill="#444" text-anchor="end">＋ 출장 점검비 (단독 호출 시)</text>
  <rect x="315" y="435" width="35" height="24" rx="4" fill="#efc8b8"/>
  <rect x="375" y="435" width="25" height="24" rx="4" fill="#e6e6e6"/>
  <text x="410" y="452" font-size="14" fill="#a8512f">평일 3~10 · 야간 긴급 15~20</text>

  <!-- 범례 -->
  <g font-size="12" fill="#8a8a8a">
    <rect x="300" y="490" width="14" height="14" rx="3" fill="#C26B4A"/>
    <text x="320" y="502">교체 공사 본 항목</text>
    <rect x="440" y="490" width="14" height="14" rx="3" fill="#efc8b8"/>
    <text x="460" y="502">현장 상태에 따라 붙는 부가 항목</text>
  </g>

  <text x="40" y="575" font-size="13" fill="#a0a0a0">※ 인테리어 공사 중에 묶으면 출장비가 사라지고 ④의 까대기·마감 보수가 다른 공정과 합쳐져 하단으로 내려갑니다.</text>
</svg>
