<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Pretendard, 'Noto Sans KR', Apple SD Gothic Neo, sans-serif" role="img" aria-label="시스템 에어컨 벽걸이 비교 — 34평/84타입 시나리오별 총비용: 기준(자가·인테리어 동시) 시스템 약 1,150만 vs 스탠드+벽걸이 약 735만, 거주 중 설치 약 1,250만~1,400만 vs 735만, 구축 단내림 약 1,260만 vs 735만, 5년 뒤 이사(5년 합계) 약 880만 vs 약 530만~610만">
  <rect width="820" height="520" fill="#fffdf9"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#2b2b2b">34평/84타입 시나리오별 총비용 — 시스템 4대 vs 스탠드+벽걸이</text>
  <text x="30" y="64" font-size="13" fill="#777">초기 구매·설치 + 여름 전기료 순증 + 분해청소(2년 1회) 합계 · 예시 계산 · 단위: 만원</text>

  <!-- legend -->
  <rect x="30" y="82" width="14" height="14" rx="2" fill="#c8623d"/>
  <text x="50" y="94" font-size="13" fill="#444">시스템 에어컨 4대</text>
  <rect x="180" y="82" width="14" height="14" rx="2" fill="#d9cbb8"/>
  <text x="200" y="94" font-size="13" fill="#444">스탠드 1대 + 벽걸이 3대</text>

  <!-- axis -->
  <line x1="230" y1="112" x2="230" y2="470" stroke="#ddd"/>
  <line x1="230" y1="470" x2="790" y2="470" stroke="#ddd"/>
  <!-- scale: 1,400만 = 520px → 0.371px per 만원 -->
  <g font-size="11" fill="#999">
    <text x="416" y="488" text-anchor="middle">500</text>
    <line x1="416" y1="112" x2="416" y2="470" stroke="#eee"/>
    <text x="601" y="488" text-anchor="middle">1,000</text>
    <line x1="601" y1="112" x2="601" y2="470" stroke="#eee"/>
  </g>

  <!-- 1. 기준 -->
  <text x="220" y="140" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">① 기준 · 10년</text>
  <text x="220" y="158" font-size="11" fill="#888" text-anchor="end">자가 · 인테리어 동시 시공</text>
  <rect x="230" y="122" width="427" height="20" fill="#c8623d"/>
  <text x="663" y="137" font-size="13" font-weight="700" fill="#c8623d">약 1,150</text>
  <rect x="230" y="146" width="273" height="20" fill="#d9cbb8"/>
  <text x="509" y="161" font-size="13" font-weight="600" fill="#555">약 735</text>
  <text x="760" y="150" font-size="12" fill="#999" text-anchor="end">차이 약 415</text>

  <!-- 2. 거주 중 설치 -->
  <text x="220" y="228" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">② 살면서 설치 · 10년</text>
  <text x="220" y="246" font-size="11" fill="#888" text-anchor="end">보양·도배 복구 +100만~250만</text>
  <rect x="230" y="210" width="464" height="20" fill="#c8623d"/>
  <rect x="694" y="210" width="56" height="20" fill="#e9a87c"/>
  <text x="754" y="225" font-size="13" font-weight="700" fill="#c8623d">1,250~1,400</text>
  <rect x="230" y="234" width="273" height="20" fill="#d9cbb8"/>
  <text x="509" y="249" font-size="13" font-weight="600" fill="#555">약 735</text>

  <!-- 3. 구축 단내림 -->
  <text x="220" y="316" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">③ 구축 · 단내림 포함 · 10년</text>
  <text x="220" y="334" font-size="11" fill="#888" text-anchor="end">초기 760만 실제 사례 기준</text>
  <rect x="230" y="298" width="468" height="20" fill="#c8623d"/>
  <text x="704" y="313" font-size="13" font-weight="700" fill="#c8623d">약 1,260</text>
  <rect x="230" y="322" width="273" height="20" fill="#d9cbb8"/>
  <text x="509" y="337" font-size="13" font-weight="600" fill="#555">약 735</text>
  <text x="760" y="326" font-size="12" fill="#999" text-anchor="end">차이 약 525</text>

  <!-- 4. 5년 이사 -->
  <text x="220" y="404" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">④ 5년 뒤 이사 · 5년 합계</text>
  <text x="220" y="422" font-size="11" fill="#888" text-anchor="end">시스템은 집에 남음(회수 0)</text>
  <rect x="230" y="386" width="327" height="20" fill="#c8623d"/>
  <text x="563" y="401" font-size="13" font-weight="700" fill="#c8623d">약 880</text>
  <rect x="230" y="410" width="197" height="20" fill="#d9cbb8"/>
  <rect x="427" y="410" width="30" height="20" fill="#efe6da"/>
  <text x="463" y="425" font-size="13" font-weight="600" fill="#555">530 + 이전설치 40~80</text>
  <text x="760" y="414" font-size="12" fill="#999" text-anchor="end">5년에 차이 약 300~350</text>

  <text x="30" y="508" font-size="11" fill="#aaa">실제 견적·시공 빅데이터 1,000건+ 기준 중간값 예시. 브랜드·배관 길이·실외기 위치·사용 패턴에 따라 달라집니다.</text>
</svg>
