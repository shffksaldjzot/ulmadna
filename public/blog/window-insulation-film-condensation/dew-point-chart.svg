<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="단열필름 결로 원리 — 외기 영하 10도일 때 유리 종류별 실내 쪽 표면온도와 습도별 이슬점 비교">
  <rect width="720" height="412" fill="#faf7f4"/>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#2b2b2b">유리 표면이 이슬점보다 차가우면 결로가 맺힙니다</text>
  <text x="24" y="60" font-size="13" fill="#8a8175">외기 -10℃ · 실내 22℃ 기준, 창 중앙부 실내 쪽 표면온도(단순 열관류 계산 추정치)</text>

  <!-- dew point lines -->
  <line x1="512" y1="86" x2="512" y2="300" stroke="#a84e2c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="568" y1="86" x2="568" y2="300" stroke="#a84e2c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="616" y1="86" x2="616" y2="300" stroke="#a84e2c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="512" y="80" font-size="12" font-weight="700" fill="#a84e2c" text-anchor="middle">습도 50%</text>
  <text x="568" y="80" font-size="12" font-weight="700" fill="#a84e2c" text-anchor="middle">60%</text>
  <text x="616" y="80" font-size="12" font-weight="700" fill="#a84e2c" text-anchor="middle">70%</text>

  <!-- row 1: single glass -->
  <text x="24" y="122" font-size="14" font-weight="700" fill="#4a3527">홑유리(구형 단창)</text>
  <text x="24" y="140" font-size="11" fill="#8a8175">열관류율 약 5.8</text>
  <rect x="190" y="104" width="58" height="36" rx="6" fill="#cf7a55"/>
  <text x="256" y="128" font-size="13" font-weight="700" fill="#4a3527">약 -2℃</text>

  <!-- row 2: normal double glass -->
  <text x="24" y="182" font-size="14" font-weight="700" fill="#4a3527">일반 복층유리</text>
  <text x="24" y="200" font-size="11" fill="#8a8175">열관류율 약 2.7</text>
  <rect x="190" y="164" width="320" height="36" rx="6" fill="#d98b6a"/>
  <text x="392" y="188" font-size="13" font-weight="700" fill="#33190e">약 11℃</text>

  <!-- row 3: double glass + film -->
  <text x="24" y="242" font-size="14" font-weight="700" fill="#4a3527">일반 복층 + 로이 필름</text>
  <text x="24" y="260" font-size="11" fill="#8a8175">필름이 올려주는 폭 약 1℃</text>
  <rect x="190" y="224" width="340" height="36" rx="6" fill="#e8b399"/>
  <text x="402" y="248" font-size="13" font-weight="700" fill="#4a3527">약 12℃</text>

  <!-- row 4: low-e double glass -->
  <text x="24" y="302" font-size="14" font-weight="700" fill="#4a3527">로이 복층유리</text>
  <text x="24" y="320" font-size="11" fill="#8a8175">열관류율 약 1.5</text>
  <rect x="190" y="284" width="416" height="36" rx="6" fill="#8fb79a"/>
  <text x="438" y="308" font-size="13" font-weight="700" fill="#1f3d2b">약 16℃</text>

  <!-- axis -->
  <line x1="190" y1="336" x2="690" y2="336" stroke="#c9beb2" stroke-width="1"/>
  <text x="190" y="354" font-size="11" fill="#8a8175" text-anchor="middle">-5℃</text>
  <text x="290" y="354" font-size="11" fill="#8a8175" text-anchor="middle">0℃</text>
  <text x="390" y="354" font-size="11" fill="#8a8175" text-anchor="middle">5℃</text>
  <text x="490" y="354" font-size="11" fill="#8a8175" text-anchor="middle">10℃</text>
  <text x="590" y="354" font-size="11" fill="#8a8175" text-anchor="middle">15℃</text>
  <text x="690" y="354" font-size="11" fill="#8a8175" text-anchor="middle">20℃</text>

  <text x="24" y="380" font-size="12" fill="#6b5d52">점선 = 실내 22℃에서 습도별 이슬점 (50% 약 11℃ · 60% 약 14℃ · 70% 약 16℃)</text>
  <text x="24" y="398" font-size="12" fill="#6b5d52">막대 끝이 점선보다 왼쪽이면 그 습도에서 결로가 맺힙니다. 유리 가장자리·창틀은 이보다 더 차갑습니다.</text>
</svg>
