<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="방문 처짐 수리 비용 단계별 비교">
  <rect width="720" height="340" fill="#faf7f2"/>
  <text x="24" y="34" font-family="sans-serif" font-size="18" font-weight="700" fill="#2b2b2b">방문 처짐 수리 비용 — 단계별 (만원)</text>
  <g font-family="sans-serif" font-size="14" fill="#2b2b2b">
    <text x="24" y="86">셀프 조임·조절</text>
    <rect x="180" y="68" width="6" height="26" fill="#c8704f"/>
    <text x="196" y="86">1만 이하</text>

    <text x="24" y="136">경첩 1~3개 교체</text>
    <rect x="180" y="118" width="120" height="26" fill="#c8704f"/>
    <text x="310" y="136">3만~12만</text>

    <text x="24" y="186">경첩 + 문틀 보강</text>
    <rect x="180" y="168" width="180" height="26" fill="#c8704f"/>
    <text x="370" y="186">12만~18만</text>

    <text x="24" y="236">출장 수리</text>
    <rect x="180" y="218" width="150" height="26" fill="#c8704f"/>
    <text x="340" y="236">5만~15만</text>

    <text x="24" y="286">문짝만 교체</text>
    <rect x="180" y="268" width="250" height="26" fill="#8a8a8a"/>
    <text x="440" y="286">짝당 15만~25만</text>
  </g>
  <text x="24" y="324" font-family="sans-serif" font-size="12" fill="#777">얼마드나 실제 견적 빅데이터 1,000건+ 기준 · 막대 길이는 상한 기준 비교용</text>
</svg>
