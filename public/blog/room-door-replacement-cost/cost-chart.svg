<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="800" height="400" fill="#FDFBF8"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#3D3833">방문 교체 비용 비교 — 방법별 (1짝·1세트 기준)</text>
  <text x="30" y="66" font-size="13" fill="#8A8177">실제 견적 빅데이터 1,000건+ 기준 · 철거·시공비 포함 가격대</text>

  <!-- grid -->
  <g stroke="#E8E1D8" stroke-width="1">
    <line x1="170" y1="90" x2="170" y2="330"/>
    <line x1="290" y1="90" x2="290" y2="330"/>
    <line x1="410" y1="90" x2="410" y2="330"/>
    <line x1="530" y1="90" x2="530" y2="330"/>
    <line x1="650" y1="90" x2="650" y2="330"/>
    <line x1="770" y1="90" x2="770" y2="330"/>
  </g>
  <g font-size="12" fill="#8A8177" text-anchor="middle">
    <text x="170" y="352">0</text>
    <text x="290" y="352">10만</text>
    <text x="410" y="352">20만</text>
    <text x="530" y="352">30만</text>
    <text x="650" y="352">40만</text>
    <text x="770" y="352">50만원</text>
  </g>

  <!-- bars -->
  <g font-size="14" fill="#3D3833">
    <!-- 손잡이만 -->
    <text x="158" y="121" text-anchor="end" font-weight="600">손잡이만</text>
    <rect x="206" y="104" width="36" height="26" rx="6" fill="#D9CFC2"/>
    <text x="252" y="122" font-size="13" fill="#8A8177">3만~6만원 (셀프는 1만원대)</text>

    <!-- 필름 리폼 -->
    <text x="158" y="181" text-anchor="end" font-weight="600">필름 리폼</text>
    <rect x="350" y="164" width="108" height="26" rx="6" fill="#E3A183"/>
    <text x="468" y="182" font-size="13" fill="#8A8177">15만~24만원 (문짝+문틀 겉면만)</text>

    <!-- 문짝만 교체 -->
    <text x="158" y="241" text-anchor="end" font-weight="600">문짝만 교체</text>
    <rect x="350" y="224" width="120" height="26" rx="6" fill="#C96F4A"/>
    <text x="480" y="242" font-size="13" fill="#8A8177">15만~25만원 (ABS도어, 짝당)</text>

    <!-- 문짝+문틀 세트 -->
    <text x="158" y="301" text-anchor="end" font-weight="600">문짝+문틀 세트</text>
    <rect x="494" y="284" width="252" height="26" rx="6" fill="#A04E2D"/>
    <text x="500" y="278" font-size="13" fill="#8A8177">27만~48만원 (세트당)</text>
  </g>
</svg>
