<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Pretendard, 'Noto Sans KR', Apple SD Gothic Neo, sans-serif" role="img" aria-label="34평/84타입 에어컨 구성별 10년 총비용 비교 — 시스템 4대 약 1,150만원, 거실 시스템+방 벽걸이 혼용 약 825만원, 스탠드+벽걸이 약 735만원">
  <rect width="820" height="460" fill="#fffdf9"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#2b2b2b">34평/84타입 에어컨 구성별 10년 총비용 (예시 계산)</text>
  <text x="30" y="64" font-size="13" fill="#777">초기 구매·설치 + 여름 전기료 순증(10년) + 분해청소(2년 1회×10년) · 단위: 만원</text>

  <!-- legend -->
  <rect x="30" y="82" width="14" height="14" rx="2" fill="#c8623d"/>
  <text x="50" y="94" font-size="13" fill="#444">초기 비용</text>
  <rect x="140" y="82" width="14" height="14" rx="2" fill="#e9a87c"/>
  <text x="160" y="94" font-size="13" fill="#444">전기료 순증 10년</text>
  <rect x="290" y="82" width="14" height="14" rx="2" fill="#d9cbb8"/>
  <text x="310" y="94" font-size="13" fill="#444">분해청소 10년</text>

  <!-- axis -->
  <line x1="200" y1="120" x2="200" y2="400" stroke="#ddd"/>
  <line x1="200" y1="400" x2="790" y2="400" stroke="#ddd"/>
  <!-- scale: 1,250만 = 560px → 0.448px per 만원 -->
  <g font-size="11" fill="#999">
    <text x="424" y="418" text-anchor="middle">500</text>
    <line x1="424" y1="120" x2="424" y2="400" stroke="#eee"/>
    <text x="648" y="418" text-anchor="middle">1,000</text>
    <line x1="648" y1="120" x2="648" y2="400" stroke="#eee"/>
  </g>

  <!-- Row A: 시스템 4대 -->
  <text x="190" y="160" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">시스템 에어컨 4대</text>
  <text x="190" y="178" font-size="11" fill="#888" text-anchor="end">거실18+안방6+방5+방5, 4마력</text>
  <rect x="200" y="140" width="291" height="44" fill="#c8623d"/>
  <rect x="491" y="140" width="125" height="44" fill="#e9a87c"/>
  <rect x="616" y="140" width="99" height="44" fill="#d9cbb8"/>
  <text x="345" y="167" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">650</text>
  <text x="553" y="167" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">280</text>
  <text x="665" y="167" font-size="13" fill="#555" text-anchor="middle" font-weight="600">220</text>
  <text x="722" y="167" font-size="15" font-weight="700" fill="#c8623d">약 1,150</text>

  <!-- Row C: 혼용 -->
  <text x="190" y="250" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">거실 시스템 1대 + 방 벽걸이 3대</text>
  <text x="190" y="268" font-size="11" fill="#888" text-anchor="end">혼용 구성</text>
  <rect x="200" y="230" width="188" height="44" fill="#c8623d"/>
  <rect x="388" y="230" width="112" height="44" fill="#e9a87c"/>
  <rect x="500" y="230" width="69" height="44" fill="#d9cbb8"/>
  <text x="294" y="257" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">420</text>
  <text x="444" y="257" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">250</text>
  <text x="534" y="257" font-size="13" fill="#555" text-anchor="middle" font-weight="600">155</text>
  <text x="578" y="257" font-size="15" font-weight="700" fill="#2b2b2b">약 825</text>

  <!-- Row B: 스탠드+벽걸이 -->
  <text x="190" y="340" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="end">스탠드 1대 + 벽걸이 3대</text>
  <text x="190" y="358" font-size="11" fill="#888" text-anchor="end">거실 스탠드 18평형 + 방 벽걸이</text>
  <rect x="200" y="320" width="157" height="44" fill="#c8623d"/>
  <rect x="357" y="320" width="107" height="44" fill="#e9a87c"/>
  <rect x="464" y="320" width="65" height="44" fill="#d9cbb8"/>
  <text x="278" y="347" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">350</text>
  <text x="410" y="347" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">240</text>
  <text x="496" y="347" font-size="13" fill="#555" text-anchor="middle" font-weight="600">145</text>
  <text x="538" y="347" font-size="15" font-weight="700" fill="#2b2b2b">약 735</text>

  <text x="30" y="445" font-size="11" fill="#999">* 초기 비용은 인테리어 동시 시공·중간값 기준. 구축 단내림·거주 중 시공은 시스템 쪽이 +100만~250만. 전기료는 실측 고지서 기반 여름 4개월 순증 추정.</text>
</svg>
