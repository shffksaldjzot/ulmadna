<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="탄성코트 셀프 시공(롤러) vs 업체 시공(스프레이) 순서 비교">
  <style>
    .t { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #333; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12px; fill: #777; }
    .col { font-size: 14px; font-weight: 700; }
    .step { font-size: 12.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
  </style>
  <rect width="720" height="480" fill="#fff"/>
  <text x="24" y="34" class="t title">탄성코트 셀프 시공 vs 업체 시공 — 순서 비교</text>
  <text x="24" y="54" class="t sub">같은 도장 공정이라도 전처리·보양·마감 방식이 다릅니다.</text>

  <!-- Left column: 셀프 (롤러/붓) -->
  <rect x="24" y="74" width="320" height="30" rx="6" fill="#9aa7b2"/>
  <text x="184" y="94" class="t col" text-anchor="middle" fill="#fff">셀프 시공 (롤러·붓)</text>

  <g class="t step">
    <circle cx="40" cy="128" r="11" fill="#6b7883"/>
    <text x="40" y="132" class="num" text-anchor="middle">1</text>
    <text x="60" y="132">벽 상태 확인 (곰팡이·균열·눅눅함)</text>

    <circle cx="40" cy="166" r="11" fill="#6b7883"/>
    <text x="40" y="170" class="num" text-anchor="middle">2</text>
    <text x="60" y="170">곰팡이 제거 + 완전 건조</text>

    <circle cx="40" cy="204" r="11" fill="#6b7883"/>
    <text x="40" y="208" class="num" text-anchor="middle">3</text>
    <text x="60" y="208">크랙 보수 (빠데+스크래퍼)</text>

    <circle cx="40" cy="242" r="11" fill="#6b7883"/>
    <text x="40" y="246" class="num" text-anchor="middle">4</text>
    <text x="60" y="246">보양 (비닐+테이프, 직접)</text>

    <circle cx="40" cy="280" r="11" fill="#6b7883"/>
    <text x="40" y="284" class="num" text-anchor="middle">5</text>
    <text x="60" y="284">롤러·붓 도장 (2~3회)</text>

    <circle cx="40" cy="318" r="11" fill="#6b7883"/>
    <text x="40" y="322" class="num" text-anchor="middle">6</text>
    <text x="60" y="322">자연 건조·정리</text>
  </g>
  <line x1="40" y1="139" x2="40" y2="155" stroke="#c7cdd2" stroke-width="2"/>
  <line x1="40" y1="177" x2="40" y2="193" stroke="#c7cdd2" stroke-width="2"/>
  <line x1="40" y1="215" x2="40" y2="231" stroke="#c7cdd2" stroke-width="2"/>
  <line x1="40" y1="253" x2="40" y2="269" stroke="#c7cdd2" stroke-width="2"/>
  <line x1="40" y1="291" x2="40" y2="307" stroke="#c7cdd2" stroke-width="2"/>

  <!-- Right column: 업체 (스프레이) -->
  <rect x="376" y="74" width="320" height="30" rx="6" fill="#c96f4a"/>
  <text x="536" y="94" class="t col" text-anchor="middle" fill="#fff">업체 시공 (스프레이)</text>

  <g class="t step">
    <circle cx="392" cy="128" r="11" fill="#c96f4a"/>
    <text x="392" y="132" class="num" text-anchor="middle">1</text>
    <text x="412" y="132">현장 진단 (결로 vs 누수 구분)</text>

    <circle cx="392" cy="166" r="11" fill="#c96f4a"/>
    <text x="392" y="170" class="num" text-anchor="middle">2</text>
    <text x="412" y="170">들뜬 도막 제거 + 바탕면 보수</text>

    <circle cx="392" cy="204" r="11" fill="#c96f4a"/>
    <text x="392" y="208" class="num" text-anchor="middle">3</text>
    <text x="412" y="208">제품 맞춤 프라이머(하도) 처리</text>

    <circle cx="392" cy="242" r="11" fill="#c96f4a"/>
    <text x="392" y="246" class="num" text-anchor="middle">4</text>
    <text x="412" y="246">전문 보양 (콘센트·배관·배수구까지)</text>

    <circle cx="392" cy="280" r="11" fill="#c96f4a"/>
    <text x="392" y="284" class="num" text-anchor="middle">5</text>
    <text x="412" y="284">스프레이 분사 (균일한 요철 마감)</text>

    <circle cx="392" cy="318" r="11" fill="#c96f4a"/>
    <text x="392" y="322" class="num" text-anchor="middle">6</text>
    <text x="412" y="322">건조 확인 + A/S 등록</text>
  </g>
  <line x1="392" y1="139" x2="392" y2="155" stroke="#e8b4a0" stroke-width="2"/>
  <line x1="392" y1="177" x2="392" y2="193" stroke="#e8b4a0" stroke-width="2"/>
  <line x1="392" y1="215" x2="392" y2="231" stroke="#e8b4a0" stroke-width="2"/>
  <line x1="392" y1="253" x2="392" y2="269" stroke="#e8b4a0" stroke-width="2"/>
  <line x1="392" y1="291" x2="392" y2="307" stroke="#e8b4a0" stroke-width="2"/>

  <rect x="24" y="352" width="672" height="104" rx="8" fill="#f6f3ee"/>
  <text x="44" y="378" class="t step" font-weight="700">차이가 나는 지점</text>
  <text x="44" y="400" class="t step">· 하도(프라이머): 셀프는 생략하기 쉽고, 업체는 바탕면·제품에 맞춰 매칭</text>
  <text x="44" y="420" class="t step">· 마감 질감: 롤러는 매끈한 마감, 스프레이는 특유의 오돌토돌한 요철</text>
  <text x="44" y="440" class="t step">· 보양 범위: 셀프는 눈에 보이는 곳만, 업체는 배관·콘센트까지 세밀하게</text>
</svg>
