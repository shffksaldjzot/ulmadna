<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="냉장고장 상부 수납 높이별 사용 구간 — 바닥 기준 1,500mm 이하 상시 구간, 1,500~1,900mm 손 뻗는 구간, 1,900mm 이상 발판 구간">
  <rect width="640" height="420" fill="#fffaf5"/>
  <text x="320" y="30" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3b2a20">키큰장 높이별 수납 구간 (바닥 기준, 천장 2,400mm 예시)</text>
  <rect x="60" y="50" width="200" height="70" fill="#e8d5c4"/>
  <rect x="60" y="120" width="200" height="90" fill="#f1b88f"/>
  <rect x="60" y="210" width="200" height="130" fill="#c8e0c0"/>
  <rect x="60" y="340" width="200" height="50" fill="#d9d9d9"/>
  <text x="160" y="90" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#3b2a20">냉장고 위 상부장</text>
  <text x="160" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#3b2a20">손 뻗는 구간</text>
  <text x="160" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#3b2a20">상시 구간 (눈~허리)</text>
  <text x="160" y="370" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#3b2a20">하단 (무거운 것)</text>
  <g font-family="sans-serif" font-size="13" fill="#3b2a20">
    <text x="280" y="55">2,400mm 천장</text>
    <text x="280" y="124">1,900mm 이상 — 발판·사다리</text>
    <text x="280" y="214">1,500~1,900mm — 가끔 쓰는 것</text>
    <text x="280" y="344">600~1,500mm — 매일 쓰는 것</text>
    <text x="280" y="394">~600mm — 무겁고 큰 것</text>
  </g>
  <g stroke="#3b2a20" stroke-width="1" stroke-dasharray="3 3">
    <line x1="60" y1="120" x2="270" y2="120"/>
    <line x1="60" y1="210" x2="270" y2="210"/>
    <line x1="60" y1="340" x2="270" y2="340"/>
  </g>
</svg>
